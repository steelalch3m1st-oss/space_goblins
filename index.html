const MG_PAGES = {"dust": {"body": "<main class=\"screen\">\n \n <h1 class=\"title\">ПИЛОВА<br>БУРЯ</h1>\n <p class=\"brief lead\">Протри всі три панелі від пилу.</p>\n <section class=\"mission\">\n  <div class=\"mission-head\"><span>НАГОРОДА: +40 БАЛІВ</span><span id=\"timeTxt\">20 С</span></div>\n  <div class=\"stagebox\"><canvas id=\"cv\" width=\"208\" height=\"88\" tabindex=\"0\" aria-label=\"Три сонячні панелі в пилу. Проводь по них пальцем або мишкою. Стрілки на клавіатурі теж протирають.\"></canvas></div>\n  <div class=\"meters\">\n   <div class=\"gauge\"><div class=\"lbl\"><span>ϟ ЕНЕРГІЯ</span><b id=\"pwr\">0%</b></div><div class=\"track energy\"><i id=\"pwrBar\" style=\"width:0%\"></i></div></div>\n   <div class=\"gauge\"><div class=\"lbl\"><span>ЧАС</span><b id=\"sec\">20 С</b></div><div class=\"track time\"><i id=\"timeBar\" style=\"width:100%\"></i></div></div>\n  </div>\n  <div class=\"controls\"><div class=\"pcount\" id=\"pcount\"></div><button class=\"secondary\" id=\"skip\" style=\"margin-left:auto\">ПРОПУСТИТИ</button></div>\n  <div id=\"howMini\"></div>\n </section>\n <div class=\"source\">ДАНІ: NASA/JPL · INSIGHT · OPPORTUNITY</div>\n <div class=\"planet\" aria-hidden=\"true\"><svg viewBox=\"0 0 100 100\"><defs><pattern id=\"dither\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\"><path d=\"M0 0h2v2H0zM3 3h2v2H3z\" fill=\"#000\"/></pattern></defs><circle cx=\"50\" cy=\"50\" r=\"48\"/><path d=\"M8 40q20-28 55-17t28 45Q68 95 32 86T8 40z\"/></svg></div>\n <div class=\"intro\" id=\"intro\"><div>\n  <div class=\"eyebrow\">МАРС · ПОДІЯ ДНЯ</div>\n  <h2>ПРОТРИ<br>ПАНЕЛІ</h2>\n  <div id=\"howBig\"></div>\n  <button class=\"primary\" id=\"start\">ПОЧАТИ →</button>\n </div></div>\n <div class=\"finish hidden\" id=\"finish\"><div>\n  <div class=\"eyebrow\" id=\"outcome\">РЕЗУЛЬТАТ</div>\n  <h2 id=\"rtitle\">...</h2>\n  <p id=\"rtext\"></p>\n  <p class=\"fact\">У грудні 2022 року модуль InSight замовк, бо пил укрив його сонячні панелі.</p>\n  <div class=\"row\"><button class=\"primary\" onclick=\"FORPOST_EXIT()\">ГОТОВО →</button><button class=\"secondary\" onclick=\"FORPOST_RELOAD()\">ЩЕ РАЗ</button></div>\n </div></div>\n</main>", "css": "\n.pcount{display:flex;gap:10px;flex-wrap:wrap}\n.pc{border:1px solid #555;padding:6px 10px;font-size:8px;color:#9a9a9a;letter-spacing:.08em}\n.pc.ok{border-color:#fff;background:#fff;color:#000}\n", "js": "\n/* Спільна оболонка міні-гри: вступ, результат, «Пропустити», звіт у гру.\n   Контракт CORE (розділ 11): гра повертає {win, perfect}, завжди можна пропустити,\n   на ресурси й успіх дня не впливає, лише +40 бонусних балів. */\nconst MG_PARAMS = (() => { try { return Object.fromEntries(new URLSearchParams(location.search)); } catch (e) { return {}; } })();\nconst MG = {\n  done: false,\n  start(fn) {\n    const intro = document.querySelector('#intro');\n    const go = document.querySelector('#start');\n    go.onclick = () => { intro.classList.add('hidden'); fn(); };\n    setTimeout(() => go.focus(), 30);\n  },\n  finish(win, perfect, skipped, texts) {\n    if (MG.done) return; MG.done = true;\n    const f = document.querySelector('#finish');\n    f.querySelector('#outcome').textContent = skipped ? 'МІНІГРУ ПРОПУЩЕНО' : texts.eyebrow;\n    f.querySelector('#rtitle').innerHTML = skipped ? 'ДАЛІ<br>ЗА ПЛАНОМ' : texts.title;\n    f.querySelector('#rtext').textContent = skipped ? 'День продовжується без бонусу.' : texts.text;\n    f.classList.remove('hidden');\n    setTimeout(() => { const b = f.querySelector('button'); if (b) b.focus(); }, 30);\n    const detail = { win: !!win && !skipped, perfect: !!perfect && !skipped };\n    window.dispatchEvent(new CustomEvent('forpost:minigame-complete', { detail }));\n    if (typeof window.FORPOST_MINIGAME_DONE === 'function') window.FORPOST_MINIGAME_DONE(detail);\n  },\n  skipWire(onSkip) {\n    document.querySelector('#skip').onclick = onSkip;\n    window.addEventListener('keydown', e => { if (e.code === 'Escape' && !MG.done) onSkip(); });\n  },\n  /* Масштаб полотна лише цілими кратними: пікселі не розпливаються. */\n  fit(canvas, w, h, maxScale) {\n    const box = canvas.parentElement;\n    const resize = () => {\n      const avail = Math.max(w, box.clientWidth);\n      const s = Math.max(1, Math.min(maxScale || 6, Math.floor(avail / w)));\n      canvas.style.width = (w * s) + 'px';\n      canvas.style.height = (h * s) + 'px';\n    };\n    resize(); window.addEventListener('resize', resize);\n  },\n  toLogical(canvas, e) {\n    const r = canvas.getBoundingClientRect();\n    return { x: (e.clientX - r.left) * canvas.width / r.width, y: (e.clientY - r.top) * canvas.height / r.height };\n  },\n  reduced: matchMedia('(prefers-reduced-motion: reduce)').matches,\n};\n/* Матриця Баєра 4x4 для дизеру. */\nconst BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];\nconst dith = (x, y, level) => level > (BAYER4[(y & 3) * 4 + (x & 3)] + 0.5) / 16;\n\n/* ---- Піксельні малюнки для коміксу «що робити» ---- */\nconst PIX = {\n  hand: ['#......','##.....','#+#....','#++#...','#+++#..','#++++#.','#+++++#','#++##..','#.#+#..','...##..'],\n  check: ['.......#','......##','#....##.','##..##..','.####...','..##....'],\n  astro: ['.####.','#+##+#','.####.','######','.####.','.#..#.','.#..#.'],\n  arrowR: ['....#...','....##..','########','########','....##..','....#...'],\n};\nfunction pxCtx(cv) { const c = cv.getContext('2d'); c.imageSmoothingEnabled = false; return c; }\nfunction sprite(c, rows, x, y, col) {\n  rows.forEach((r, j) => [...r].forEach((ch, i) => { if (ch === '#') { c.fillStyle = col || '#fff'; c.fillRect(x + i, y + j, 1, 1); } else if (ch === '+') { c.fillStyle = '#000'; c.fillRect(x + i, y + j, 1, 1); } }));\n}\nfunction box(c, x, y, w, h, col) { c.fillStyle = col || '#fff'; c.fillRect(x, y, w, 1); c.fillRect(x, y + h - 1, w, 1); c.fillRect(x, y, 1, h); c.fillRect(x + w - 1, y, 1, h); }\nfunction dots(c, x, y, w, h, lvl) { c.fillStyle = '#fff'; for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (dith(x + i, y + j, lvl)) c.fillRect(x + i, y + j, 1, 1); }\nfunction howStrip(host, frames, mini) {\n  host.classList.add('howstrip'); if (mini) host.classList.add('mini');\n  host.innerHTML = frames.map((f, i) => `<div class=\"hf\"><span class=\"n\">${i + 1}</span><canvas width=\"48\" height=\"32\" aria-hidden=\"true\"></canvas><span>${f.t}</span></div>`).join('');\n  host.querySelectorAll('canvas').forEach((cv, i) => { const c = pxCtx(cv); c.fillStyle = '#000'; c.fillRect(0, 0, 48, 32); frames[i].draw(c); });\n}\n\n\n\n\n(() => {\n  const TIME = 20, PERFECT_T = 10;\n  const cv = document.querySelector('#cv'), ctx = pxCtx(cv);\n  const W = 208, H = 88, C = 8, PC = 6, PR = 5;\n  const PANELS = [{x:16,y:22},{x:80,y:22},{x:144,y:22}];\n  const cells = [];\n  PANELS.forEach((p, pi) => { for (let r = 0; r < PR; r++) for (let c = 0; c < PC; c++) cells.push({pi, c, r, px: p.x + c * C, py: p.y + r * C, dust: true}); });\n  let cur = {c: 0, r: 0, pi: 0}, running = false, left = TIME, drawing = false, last = 0, acc = 0;\n\n  // комікс «що робити»\n  const panelPic = (c, x, y, dusty) => { box(c, x, y, 26, 18); if (dusty === 1) dots(c, x + 1, y + 1, 24, 16, .5); else if (dusty === .5) dots(c, x + 1, y + 1, 12, 16, .5); if (dusty !== 1) { c.fillStyle = '#fff'; for (let i = 0; i < 5; i++) c.fillRect(x + 16 + i, y + 4 + i, 1, 1); } };\n  const FR = [\n    {t: 'ПИЛ НА ПАНЕЛІ', draw: c => panelPic(c, 11, 7, 1)},\n    {t: 'ПРОВЕДИ ПАЛЬЦЕМ', draw: c => { panelPic(c, 11, 7, .5); sprite(c, PIX.arrowR, 22, 25); sprite(c, PIX.hand, 32, 18); }},\n    {t: 'ЧИСТО = ЕНЕРГІЯ', draw: c => { panelPic(c, 6, 7, 0); sprite(c, PIX.check, 37, 12); }},\n  ];\n  howStrip(document.querySelector('#howBig'), FR);\n  howStrip(document.querySelector('#howMini'), FR, true);\n\n  MG.fit(cv, W, H, 4);\n  const power = () => cells.filter(k => !k.dust).length / cells.length;\n  const panelClean = pi => cells.every(k => k.pi !== pi || !k.dust);\n  const cellAt = (x, y) => cells.find(k => x >= k.px && x < k.px + C && y >= k.py && y < k.py + C);\n  function brush(x, y) { for (const dx of [-4, 3]) for (const dy of [-4, 3]) { const k = cellAt(x + dx, y + dy); if (k) k.dust = false; } }\n\n  function draw() {\n    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);\n    ctx.fillStyle = '#fff'; ctx.fillRect(0, 84, W, 1);\n    ctx.fillStyle = '#555'; for (let x = 0; x < W; x += 3) ctx.fillRect(x, 86, 1, 1);\n    PANELS.forEach((p, pi) => {\n      ctx.fillStyle = '#9a9a9a'; ctx.fillRect(p.x + 22, p.y + PR * C + 1, 4, 84 - (p.y + PR * C + 1));\n      const clean = panelClean(pi);\n      for (const k of cells) if (k.pi === pi) {\n        if (k.dust) { dots(ctx, k.px + 1, k.py + 1, C - 1, C - 1, .55); }\n        else { ctx.fillStyle = '#fff'; ctx.fillRect(k.px + 5, k.py + 2, 1, 1); ctx.fillRect(k.px + 6, k.py + 3, 1, 1); }   // відблиск на чистому склі\n      }\n      ctx.fillStyle = '#555';\n      for (let c = 1; c < PC; c++) ctx.fillRect(p.x + c * C, p.y, 1, PR * C);\n      for (let r = 1; r < PR; r++) ctx.fillRect(p.x, p.y + r * C, PC * C, 1);\n      box(ctx, p.x - 1, p.y - 1, PC * C + 2, PR * C + 2);\n      if (clean) { box(ctx, p.x - 3, p.y - 3, PC * C + 6, PR * C + 6); sprite(ctx, PIX.check, p.x + 20, p.y - 12); }\n    });\n    if (!drawing) { const pk = PANELS[cur.pi], bx = pk.x + cur.c * C, by = pk.y + cur.r * C; ctx.fillStyle = '#fff'; for (let i = 0; i <= C; i += 2) { ctx.fillRect(bx + i, by - 1, 1, 1); ctx.fillRect(bx + i, by + C, 1, 1); ctx.fillRect(bx - 1, by + i, 1, 1); ctx.fillRect(bx + C, by + i, 1, 1); } }\n  }\n  function hud() {\n    const p = Math.round(power() * 100), s = Math.max(0, Math.ceil(left));\n    document.querySelector('#pwr').textContent = p + '%';\n    document.querySelector('#pwrBar').style.width = p + '%';\n    document.querySelector('#sec').textContent = s + ' С';\n    document.querySelector('#timeTxt').textContent = s + ' С';\n    document.querySelector('#timeBar').style.width = (left / TIME * 100) + '%';\n    document.querySelector('#pcount').innerHTML = [0, 1, 2].map(i => `<span class=\"pc ${panelClean(i) ? 'ok' : ''}\">ПАНЕЛЬ ${i + 1}${panelClean(i) ? ' ✓' : ''}</span>`).join('');\n  }\n  function end(skipped) {\n    running = false;\n    if (skipped) return MG.finish(false, false, true, {});\n    const used = TIME - left, won = power() >= 1;\n    if (won) MG.finish(true, used <= PERFECT_T, false, {eyebrow: 'ПАНЕЛІ ЧИСТІ', title: used <= PERFECT_T ? 'ШВИДКО<br>Й ЧИСТО' : 'Є<br>ЕНЕРГІЯ', text: 'Усі панелі чисті за ' + Math.ceil(used) + ' с. +40 балів.'});\n    else MG.finish(false, false, false, {eyebrow: 'ЧАС ВИЙШОВ', title: 'СПРОБУЙ<br>ЩЕ', text: 'Чисто ' + Math.round(power() * 100) + '%. День не постраждав, просто без бонусу.'});\n  }\n  function loop(now) {\n    if (!running) return;\n    const dt = Math.min(.1, (now - last) / 1000); last = now; acc += dt; left -= dt;\n    if (acc >= 1 / 12) { acc = 0; draw(); hud(); }\n    if (power() >= 1) { draw(); hud(); return end(false); }\n    if (left <= 0) { left = 0; draw(); hud(); return end(false); }\n    requestAnimationFrame(loop);\n  }\n  cv.addEventListener('pointerdown', e => { if (!running) return; drawing = true; cv.setPointerCapture(e.pointerId); const p = MG.toLogical(cv, e); brush(p.x, p.y); });\n  cv.addEventListener('pointermove', e => { if (!running || !drawing) return; const p = MG.toLogical(cv, e); brush(p.x, p.y); });\n  window.addEventListener('pointerup', () => drawing = false);\n  window.addEventListener('keydown', e => {\n    if (!running) return;\n    const m = {ArrowLeft: [-1, 0], ArrowRight: [1, 0], ArrowUp: [0, -1], ArrowDown: [0, 1]}[e.code];\n    if (!m && e.code !== 'Space') return;\n    e.preventDefault();\n    if (m) {\n      let c = cur.c + m[0], r = Math.max(0, Math.min(PR - 1, cur.r + m[1])), pi = cur.pi;\n      if (c < 0) { if (pi > 0) { pi--; c = PC - 1; } else c = 0; }\n      if (c >= PC) { if (pi < 2) { pi++; c = 0; } else c = PC - 1; }\n      cur = {c, r, pi};\n    }\n    cells.filter(q => q.pi === cur.pi && Math.abs(q.c - cur.c) <= 1 && q.r === cur.r).forEach(q => q.dust = false);\n    draw(); hud();\n  });\n  MG.skipWire(() => end(true));\n  draw(); hud();\n  MG.start(() => { running = true; last = performance.now(); cv.focus(); requestAnimationFrame(loop); });\n})();\n\n"}, "tower": {"body": "<main class=\"screen\">\n \n <h1 class=\"title\">ВЕЖА ДО<br>СОНЦЯ</h1>\n <p class=\"brief lead\">Повертай панель за Сонцем і зарядь батарею.</p>\n <section class=\"mission\">\n  <div class=\"mission-head\"><span>НАГОРОДА: +40 БАЛІВ</span><span id=\"timeTxt\">ЗАЛИШИЛОСЬ 30 С</span></div>\n  <div class=\"towerwrap\">\n   <div class=\"stagebox\"><canvas id=\"cv\" width=\"144\" height=\"144\" tabindex=\"0\" aria-label=\"Вигляд згори: вежа в центрі, Сонце рухається по колу. Стрілки ліворуч і праворуч повертають панель.\"></canvas></div>\n   <div class=\"side\">\n    <div class=\"rot\"><button class=\"secondary\" id=\"ccw\" aria-label=\"Повернути проти годинникової стрілки\">◀ ЛІВО</button><button class=\"secondary\" id=\"cw\" aria-label=\"Повернути за годинниковою стрілкою\">ПРАВО ▶</button></div>\n    <div class=\"state\"><b id=\"aim\">—</b><span id=\"aimTxt\">ПОВЕРНИ ДО СОНЦЯ.</span></div>\n   </div>\n  </div>\n  <div class=\"meters\">\n   <div class=\"gauge\"><div class=\"lbl\"><span>ϟ БАТАРЕЯ</span><b id=\"bat\">0%</b></div><div class=\"track energy\"><i id=\"batBar\" style=\"width:0%\"></i></div></div>\n   <div class=\"gauge\"><div class=\"lbl\"><span>ЧАС</span><b id=\"sec\">30 С</b></div><div class=\"track time\"><i id=\"timeBar\" style=\"width:100%\"></i></div></div>\n  </div>\n  <div class=\"controls\"><button class=\"secondary\" id=\"skip\">ПРОПУСТИТИ</button></div>\n  <div id=\"howMini\"></div>\n </section>\n <div class=\"source\">ДАНІ: NASA · VSAT · LRO</div>\n <div class=\"planet\" aria-hidden=\"true\"><svg viewBox=\"0 0 100 100\"><defs><pattern id=\"dither\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\"><path d=\"M0 0h2v2H0zM3 3h2v2H3z\" fill=\"#000\"/></pattern></defs><circle cx=\"50\" cy=\"50\" r=\"48\"/><path d=\"M8 40q20-28 55-17t28 45Q68 95 32 86T8 40z\"/></svg></div>\n <div class=\"intro\" id=\"intro\"><div>\n  <div class=\"eyebrow\">МІСЯЦЬ · ТАБІР ARTEMIS</div>\n  <h2>ЛОВИ<br>СОНЦЕ</h2>\n  <div id=\"howBig\"></div>\n  <button class=\"primary\" id=\"start\">ПОЧАТИ →</button>\n </div></div>\n <div class=\"finish hidden\" id=\"finish\"><div>\n  <div class=\"eyebrow\" id=\"outcome\">РЕЗУЛЬТАТ</div>\n  <h2 id=\"rtitle\">...</h2>\n  <p id=\"rtext\"></p>\n  <p class=\"fact\">На полюсі Місяця Сонце ходить низько по колу, тому NASA розробляє сонячні вежі, які повертаються за ним.</p>\n  <div class=\"row\"><button class=\"primary\" onclick=\"FORPOST_EXIT()\">ГОТОВО →</button><button class=\"secondary\" onclick=\"FORPOST_RELOAD()\">ЩЕ РАЗ</button></div>\n </div></div>\n</main>", "css": "\n.towerwrap{display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:18px;align-items:center}\n.side{display:flex;flex-direction:column;gap:12px;min-width:0}\n.rot{display:grid;grid-template-columns:1fr 1fr;gap:8px}\n.rot button{min-height:56px;white-space:nowrap;padding:0 10px}\n.state{border:1px solid #555;padding:10px;font-size:8px;line-height:2;color:#9a9a9a}\n.state b{display:block;color:#fff;font:700 22px/1.1 Handjet,monospace;letter-spacing:.05em}\n@media(max-width:760px){.towerwrap{grid-template-columns:minmax(0,1fr)}}\n", "js": "\n/* Спільна оболонка міні-гри: вступ, результат, «Пропустити», звіт у гру.\n   Контракт CORE (розділ 11): гра повертає {win, perfect}, завжди можна пропустити,\n   на ресурси й успіх дня не впливає, лише +40 бонусних балів. */\nconst MG_PARAMS = (() => { try { return Object.fromEntries(new URLSearchParams(location.search)); } catch (e) { return {}; } })();\nconst MG = {\n  done: false,\n  start(fn) {\n    const intro = document.querySelector('#intro');\n    const go = document.querySelector('#start');\n    go.onclick = () => { intro.classList.add('hidden'); fn(); };\n    setTimeout(() => go.focus(), 30);\n  },\n  finish(win, perfect, skipped, texts) {\n    if (MG.done) return; MG.done = true;\n    const f = document.querySelector('#finish');\n    f.querySelector('#outcome').textContent = skipped ? 'МІНІГРУ ПРОПУЩЕНО' : texts.eyebrow;\n    f.querySelector('#rtitle').innerHTML = skipped ? 'ДАЛІ<br>ЗА ПЛАНОМ' : texts.title;\n    f.querySelector('#rtext').textContent = skipped ? 'День продовжується без бонусу.' : texts.text;\n    f.classList.remove('hidden');\n    setTimeout(() => { const b = f.querySelector('button'); if (b) b.focus(); }, 30);\n    const detail = { win: !!win && !skipped, perfect: !!perfect && !skipped };\n    window.dispatchEvent(new CustomEvent('forpost:minigame-complete', { detail }));\n    if (typeof window.FORPOST_MINIGAME_DONE === 'function') window.FORPOST_MINIGAME_DONE(detail);\n  },\n  skipWire(onSkip) {\n    document.querySelector('#skip').onclick = onSkip;\n    window.addEventListener('keydown', e => { if (e.code === 'Escape' && !MG.done) onSkip(); });\n  },\n  /* Масштаб полотна лише цілими кратними: пікселі не розпливаються. */\n  fit(canvas, w, h, maxScale) {\n    const box = canvas.parentElement;\n    const resize = () => {\n      const avail = Math.max(w, box.clientWidth);\n      const s = Math.max(1, Math.min(maxScale || 6, Math.floor(avail / w)));\n      canvas.style.width = (w * s) + 'px';\n      canvas.style.height = (h * s) + 'px';\n    };\n    resize(); window.addEventListener('resize', resize);\n  },\n  toLogical(canvas, e) {\n    const r = canvas.getBoundingClientRect();\n    return { x: (e.clientX - r.left) * canvas.width / r.width, y: (e.clientY - r.top) * canvas.height / r.height };\n  },\n  reduced: matchMedia('(prefers-reduced-motion: reduce)').matches,\n};\n/* Матриця Баєра 4x4 для дизеру. */\nconst BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];\nconst dith = (x, y, level) => level > (BAYER4[(y & 3) * 4 + (x & 3)] + 0.5) / 16;\n\n/* ---- Піксельні малюнки для коміксу «що робити» ---- */\nconst PIX = {\n  hand: ['#......','##.....','#+#....','#++#...','#+++#..','#++++#.','#+++++#','#++##..','#.#+#..','...##..'],\n  check: ['.......#','......##','#....##.','##..##..','.####...','..##....'],\n  astro: ['.####.','#+##+#','.####.','######','.####.','.#..#.','.#..#.'],\n  arrowR: ['....#...','....##..','########','########','....##..','....#...'],\n};\nfunction pxCtx(cv) { const c = cv.getContext('2d'); c.imageSmoothingEnabled = false; return c; }\nfunction sprite(c, rows, x, y, col) {\n  rows.forEach((r, j) => [...r].forEach((ch, i) => { if (ch === '#') { c.fillStyle = col || '#fff'; c.fillRect(x + i, y + j, 1, 1); } else if (ch === '+') { c.fillStyle = '#000'; c.fillRect(x + i, y + j, 1, 1); } }));\n}\nfunction box(c, x, y, w, h, col) { c.fillStyle = col || '#fff'; c.fillRect(x, y, w, 1); c.fillRect(x, y + h - 1, w, 1); c.fillRect(x, y, 1, h); c.fillRect(x + w - 1, y, 1, h); }\nfunction dots(c, x, y, w, h, lvl) { c.fillStyle = '#fff'; for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (dith(x + i, y + j, lvl)) c.fillRect(x + i, y + j, 1, 1); }\nfunction howStrip(host, frames, mini) {\n  host.classList.add('howstrip'); if (mini) host.classList.add('mini');\n  host.innerHTML = frames.map((f, i) => `<div class=\"hf\"><span class=\"n\">${i + 1}</span><canvas width=\"48\" height=\"32\" aria-hidden=\"true\"></canvas><span>${f.t}</span></div>`).join('');\n  host.querySelectorAll('canvas').forEach((cv, i) => { const c = pxCtx(cv); c.fillStyle = '#000'; c.fillRect(0, 0, 48, 32); frames[i].draw(c); });\n}\n\n\n\n\n(() => {\n  const TIME = 30, RATE = 6.2, PERFECT_LEFT = 5, ROT = 120, AIM_OK = 14;   // RATE: % батареї за секунду при точному наведенні\n  const SHADOWS = [[40, 85], [205, 245]];             // сектори тіні від гір, у градусах\n  const cv = document.querySelector('#cv'), ctx = cv.getContext('2d'), W = 144, H = 144, CX = 72, CY = 72, R = 58;\n  \n  let sun = 300, sunSpeed = 22, panel = 120, bat = 0, left = TIME, running = false, last = 0, acc = 0, hold = 0, dragging = false, alignedT = 0;\n  const ring = (c, cx, cy, r) => { for (let a = 0; a < 360; a += 20) c.fillRect(Math.round(cx + Math.cos(a * Math.PI / 180) * r), Math.round(cy + Math.sin(a * Math.PI / 180) * r), 1, 1); };\n  const sunPic = (c, x, y) => { c.fillStyle = '#fff'; c.fillRect(x - 1, y - 2, 3, 5); c.fillRect(x - 2, y - 1, 5, 3); c.fillRect(x, y - 4, 1, 1); c.fillRect(x, y + 4, 1, 1); c.fillRect(x - 4, y, 1, 1); c.fillRect(x + 4, y, 1, 1); };\n  const tw = (c, x, y, dx, dy) => { c.fillStyle = '#fff'; c.fillRect(x - 1, y - 1, 3, 3); for (let i = 2; i <= 7; i++) c.fillRect(Math.round(x + dx * i), Math.round(y + dy * i), 1, 1); };\n  const FR = [\n    {t: 'СОНЦЕ ЙДЕ ПО КОЛУ', draw: c => { c.fillStyle = '#9a9a9a'; ring(c, 24, 16, 12); sunPic(c, 36, 12); c.fillStyle = '#fff'; c.fillRect(23, 15, 3, 3); sprite(c, PIX.arrowR, 36, 22); }},\n    {t: 'ПОВЕРТАЙ ПАНЕЛЬ', draw: c => { tw(c, 24, 16, -.7, .7); c.fillStyle = '#fff'; for (let i = 0; i < 4; i++) { c.fillRect(8 + i, 16 - i, 1, 1); c.fillRect(8 + i, 16 + i, 1, 1); c.fillRect(39 - i, 16 - i, 1, 1); c.fillRect(39 - i, 16 + i, 1, 1); } }},\n    {t: 'НА СОНЦЕ = ЗАРЯД', draw: c => { sunPic(c, 38, 8); tw(c, 18, 20, .8, -.5); box(c, 8, 4, 14, 8); c.fillStyle = '#fff'; c.fillRect(22, 6, 1, 4); for (let i = 0; i < 3; i++) c.fillRect(10 + i * 4, 6, 3, 4); }},\n  ];\n  howStrip(document.querySelector('#howBig'), FR);\n  howStrip(document.querySelector('#howMini'), FR, true);\n  MG.fit(cv, W, H, 3);\n  const norm = a => ((a % 360) + 360) % 360;\n  const diff = (a, b) => { const d = Math.abs(norm(a) - norm(b)); return d > 180 ? 360 - d : d; };\n  const inShadow = a => SHADOWS.some(([f, t]) => norm(a) >= f && norm(a) <= t);\n  const px = (x, y, c) => { ctx.fillStyle = c || '#fff'; ctx.fillRect(Math.round(x), Math.round(y), 1, 1); };\n  function line(x0, y0, x1, y1, c) { x0 = Math.round(x0); y0 = Math.round(y0); x1 = Math.round(x1); y1 = Math.round(y1);\n    const dx = Math.abs(x1 - x0), dy = -Math.abs(y1 - y0), sx = x0 < x1 ? 1 : -1, sy = y0 < y1 ? 1 : -1; let e = dx + dy;\n    for (;;) { px(x0, y0, c); if (x0 === x1 && y0 === y1) break; const e2 = 2 * e; if (e2 >= dy) { e += dy; x0 += sx; } if (e2 <= dx) { e += dx; y0 += sy; } } }\n  const pol = (a, r) => [CX + Math.cos((a - 90) * Math.PI / 180) * r, CY + Math.sin((a - 90) * Math.PI / 180) * r];\n\n  function draw() {\n    ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);\n    // тінь від гір: заштриховані сектори за колом обрію\n    for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {\n      const dx = x - CX, dy = y - CY, d = Math.hypot(dx, dy);\n      if (d < R - 2 || d > R + 12) continue;\n      const a = norm(Math.atan2(dy, dx) * 180 / Math.PI + 90);\n      if (inShadow(a) && (x + y) % 3 === 0) px(x, y, '#9a9a9a');\n    }\n    // гори — зубці на краю тіні\n    SHADOWS.forEach(([f, t]) => { for (let a = f; a <= t; a += 9) { const [x1, y1] = pol(a, R + 2), [x2, y2] = pol(a + 4.5, R + 9), [x3, y3] = pol(a + 9, R + 2); line(x1, y1, x2, y2); line(x2, y2, x3, y3); } });\n    // коло обрію (пунктир)\n    for (let a = 0; a < 360; a += 3) { const [x, y] = pol(a, R); px(x, y, '#555'); }\n    // поділки сторін світу\n    for (let a = 0; a < 360; a += 45) { const [x1, y1] = pol(a, R - 3), [x2, y2] = pol(a, R + 1); line(x1, y1, x2, y2, '#9a9a9a'); }\n    // промінь від Сонця до вежі\n    const [sx, sy] = pol(sun, R), lit = !inShadow(sun);\n    if (lit) for (let i = 0; i <= 40; i++) { const t = i / 40; if (i % 3 === 0) px(CX + (sx - CX) * t, CY + (sy - CY) * t, '#555'); }\n    // Сонце: піксельне коло з променями або контур у тіні\n    for (let y = -4; y <= 4; y++) for (let x = -4; x <= 4; x++) { const d = Math.hypot(x, y); if (lit ? d <= 3.6 : (d > 2.6 && d <= 3.6)) px(sx + x, sy + y, lit ? '#fff' : '#9a9a9a'); }\n    if (lit) for (let k = 0; k < 8; k++) { const a = k * 45; const x1 = sx + Math.cos(a * Math.PI / 180) * 5, y1 = sy + Math.sin(a * Math.PI / 180) * 5, x2 = sx + Math.cos(a * Math.PI / 180) * 7, y2 = sy + Math.sin(a * Math.PI / 180) * 7; line(x1, y1, x2, y2); }\n    // вежа і панель\n    for (let y = -4; y <= 4; y++) for (let x = -4; x <= 4; x++) if (Math.abs(x) === 4 || Math.abs(y) === 4 || (x + y) % 2 === 0) px(CX + x, CY + y);\n    const [n1x, n1y] = pol(panel + 90, 13), [n2x, n2y] = pol(panel - 90, 13), [fx, fy] = pol(panel, 22);\n    line(n1x, n1y, n2x, n2y); line(n1x + (fx - CX) * .08, n1y + (fy - CY) * .08, n2x + (fx - CX) * .08, n2y + (fy - CY) * .08);\n    line(CX, CY, fx, fy, '#9a9a9a'); px(fx, fy); px(fx + 1, fy); px(fx, fy + 1);\n  }\n  function output() { if (inShadow(sun)) return 0; const d = diff(sun, panel); return d >= 90 ? 0 : Math.pow(Math.cos(d * Math.PI / 180), 4); }\n  function hud() {\n    const b = Math.min(100, Math.floor(bat)), s = Math.max(0, Math.ceil(left)), o = output(), d = Math.round(diff(sun, panel));\n    document.querySelector('#bat').textContent = b + '%'; document.querySelector('#batBar').style.width = b + '%';\n    document.querySelector('#sec').textContent = s + ' С'; document.querySelector('#timeBar').style.width = (left / TIME * 100) + '%';\n    document.querySelector('#timeTxt').textContent = 'ЗАЛИШИЛОСЬ ' + s + ' С';\n    const aim = document.querySelector('#aim'), aimTxt = document.querySelector('#aimTxt');\n    if (inShadow(sun)) { aim.textContent = 'ТІНЬ'; aimTxt.textContent = 'СОНЦЕ ЗА ГОРОЮ. ЧЕКАЙ.'; }\n    else if (d <= AIM_OK) { aim.textContent = 'ТОЧНО'; aimTxt.textContent = 'ЗАРЯДЖАЄТЬСЯ!'; }\n    else { aim.textContent = d + '°'; aimTxt.textContent = o > .3 ? 'МАЙЖЕ. ЩЕ ТРОХИ.' : 'ПОВЕРНИ ДО СОНЦЯ.'; }\n  }\n  function end(skipped) {\n    running = false;\n    if (skipped) return MG.finish(false, false, true, {});\n    const won = bat >= 100, perfect = won && left >= PERFECT_LEFT;\n    if (won) MG.finish(true, perfect, false, {eyebrow: 'БАТАРЕЮ ЗАРЯДЖЕНО', title: perfect ? 'ТОЧНО<br>ЗА СОНЦЕМ' : 'Є<br>ЗАРЯД', text: 'Батарея 100%. +40 балів.'});\n    else MG.finish(false, false, false, {eyebrow: 'ЗАРЯДУ ЗАМАЛО', title: 'СПРОБУЙ<br>ЩЕ', text: 'Батарея ' + Math.floor(bat) + '%. День не постраждав, просто без бонусу.'});\n  }\n  function loop(now) {\n    if (!running) return;\n    const dt = Math.min(.1, (now - last) / 1000); last = now; acc += dt; left -= dt;\n    if (hold) panel = norm(panel + hold * ROT * dt);\n    // Сонце рухається з різною швидкістю, щоб не було рівномірного кроку\n    sunSpeed += (Math.random() - .5) * 8 * dt; sunSpeed = Math.max(14, Math.min(32, sunSpeed));\n    sun = norm(sun + sunSpeed * dt);\n    const o = output(); bat += o * RATE * dt;\n    if (acc >= 1 / 12) { acc = 0; draw(); hud(); }\n    if (bat >= 100) { bat = 100; draw(); hud(); return end(false); }\n    if (left <= 0) { left = 0; draw(); hud(); return end(false); }\n    requestAnimationFrame(loop);\n  }\n  const bindHold = (id, dir) => { const b = document.querySelector(id);\n    b.addEventListener('pointerdown', e => { e.preventDefault(); hold = dir; b.setPointerCapture(e.pointerId); });\n    ['pointerup', 'pointercancel', 'pointerleave'].forEach(t => b.addEventListener(t, () => { if (hold === dir) hold = 0; })); };\n  bindHold('#ccw', -1); bindHold('#cw', 1);\n  window.addEventListener('keydown', e => { if (!running) return; if (e.code === 'ArrowLeft') { hold = -1; e.preventDefault(); } if (e.code === 'ArrowRight') { hold = 1; e.preventDefault(); } });\n  window.addEventListener('keyup', e => { if ((e.code === 'ArrowLeft' && hold === -1) || (e.code === 'ArrowRight' && hold === 1)) hold = 0; });\n  const aimTo = e => { const p = MG.toLogical(cv, e); panel = norm(Math.atan2(p.y - CY, p.x - CX) * 180 / Math.PI + 90); };\n  cv.addEventListener('pointerdown', e => { if (!running) return; dragging = true; cv.setPointerCapture(e.pointerId); aimTo(e); });\n  cv.addEventListener('pointermove', e => { if (running && dragging) aimTo(e); });\n  window.addEventListener('pointerup', () => dragging = false);\n  MG.skipWire(() => end(true));\n  draw(); hud();\n  MG.start(() => { running = true; last = performance.now(); cv.focus(); requestAnimationFrame(loop); });\n})();\n\n"}, "shelter": {"body": "<main class=\"screen\">\n \n <h1 class=\"title\">ВСТИГНИ<br>В УКРИТТЯ</h1>\n <p class=\"brief lead\">Сховай астронавтів за товстими стінами.</p>\n <section class=\"mission\">\n  <div class=\"mission-head\"><span>НАГОРОДА: +40 БАЛІВ</span><span id=\"timeTxt\">20 С</span></div>\n  <div class=\"outside\" id=\"outside\"><span class=\"tag\">НАЗОВНІ</span></div>\n  <div class=\"base\" id=\"base\"></div>\n  <div class=\"meters\" style=\"grid-template-columns:minmax(0,1fr)\">\n   <div class=\"gauge\"><div class=\"lbl\"><span>☢ БУРЯ ЧЕРЕЗ</span><b id=\"sec\">20 С</b></div><div class=\"track time\"><i id=\"timeBar\" style=\"width:100%\"></i></div></div>\n  </div>\n  <div class=\"controls\"><button class=\"primary\" id=\"seal\" disabled>ЗАЧИНИТИ ЛЮКИ →</button><button class=\"secondary\" id=\"skip\">ПРОПУСТИТИ</button></div>\n  <div id=\"howMini\"></div>\n </section>\n <div class=\"source\">ДАНІ: NASA DONKI · NASA SPACE RADIATION</div>\n <div class=\"planet\" aria-hidden=\"true\"><svg viewBox=\"0 0 100 100\"><defs><pattern id=\"dither\" width=\"6\" height=\"6\" patternUnits=\"userSpaceOnUse\"><path d=\"M0 0h2v2H0zM3 3h2v2H3z\" fill=\"#000\"/></pattern></defs><circle cx=\"50\" cy=\"50\" r=\"48\"/><path d=\"M8 40q20-28 55-17t28 45Q68 95 32 86T8 40z\"/></svg></div>\n <div class=\"intro\" id=\"intro\"><div>\n  <div class=\"eyebrow\">МІСЯЦЬ · СОНЯЧНА БУРЯ</div>\n  <h2>ХОВАЙСЯ<br>ВІД БУРІ</h2>\n  <div id=\"howBig\"></div>\n  <button class=\"primary\" id=\"start\">ПОЧАТИ →</button>\n </div></div>\n <div class=\"finish hidden\" id=\"finish\"><div>\n  <div class=\"eyebrow\" id=\"outcome\">РЕЗУЛЬТАТ</div>\n  <h2 id=\"rtitle\">...</h2>\n  <p id=\"rtext\"></p>\n  <p class=\"fact\">Товстий шар ґрунту чи води затримує частинки із Сонця. Скло й тонкий метал майже не захищають.</p>\n  <div class=\"row\"><button class=\"primary\" onclick=\"FORPOST_EXIT()\">ГОТОВО →</button><button class=\"secondary\" onclick=\"FORPOST_RELOAD()\">ЩЕ РАЗ</button></div>\n </div></div>\n</main>", "css": "\n.outside{border:1px dotted #9a9a9a;padding:10px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;min-height:58px;margin-top:14px;background:radial-gradient(#222 1px,transparent 1.4px) 0 0/4px 4px}\n.outside .tag{font-size:8px;color:#9a9a9a;letter-spacing:.1em}\n.base{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:12px 0 4px}\n.mod{position:relative;background:#000;border:1px solid #555;color:#fff;padding:10px;display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;min-width:0}\n.mod.over,.mod:hover{border:1px dashed #fff}\n.mod canvas{width:96px;height:64px;image-rendering:pixelated;image-rendering:crisp-edges;max-width:100%}\n.mod .nm{font:700 22px/1 Handjet,monospace;letter-spacing:.06em}\n.slots{display:flex;gap:6px;min-height:40px}\n.slot{width:56px;height:40px;border:1px dashed #555;display:flex;align-items:center;justify-content:center}\n.astro{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;background:#000;color:#fff;border:1px solid #fff;width:56px;height:40px;padding:2px;font-size:8px;cursor:grab;touch-action:none;user-select:none}\n.astro svg{width:12px;height:17px;shape-rendering:crispEdges}\n.astro.sel{background:#fff;color:#000}\n.astro.sel svg rect.b{fill:#000}\n.astro.ghost{position:fixed;z-index:20;pointer-events:none;background:#fff;color:#000}\n.astro.ghost svg rect.b{fill:#000}\n.astro.done{cursor:default}\n.astro.dose{font-size:8px}\n@media(max-width:760px){.base{grid-template-columns:repeat(2,minmax(0,1fr))}}\n", "js": "\n/* Спільна оболонка міні-гри: вступ, результат, «Пропустити», звіт у гру.\n   Контракт CORE (розділ 11): гра повертає {win, perfect}, завжди можна пропустити,\n   на ресурси й успіх дня не впливає, лише +40 бонусних балів. */\nconst MG_PARAMS = (() => { try { return Object.fromEntries(new URLSearchParams(location.search)); } catch (e) { return {}; } })();\nconst MG = {\n  done: false,\n  start(fn) {\n    const intro = document.querySelector('#intro');\n    const go = document.querySelector('#start');\n    go.onclick = () => { intro.classList.add('hidden'); fn(); };\n    setTimeout(() => go.focus(), 30);\n  },\n  finish(win, perfect, skipped, texts) {\n    if (MG.done) return; MG.done = true;\n    const f = document.querySelector('#finish');\n    f.querySelector('#outcome').textContent = skipped ? 'МІНІГРУ ПРОПУЩЕНО' : texts.eyebrow;\n    f.querySelector('#rtitle').innerHTML = skipped ? 'ДАЛІ<br>ЗА ПЛАНОМ' : texts.title;\n    f.querySelector('#rtext').textContent = skipped ? 'День продовжується без бонусу.' : texts.text;\n    f.classList.remove('hidden');\n    setTimeout(() => { const b = f.querySelector('button'); if (b) b.focus(); }, 30);\n    const detail = { win: !!win && !skipped, perfect: !!perfect && !skipped };\n    window.dispatchEvent(new CustomEvent('forpost:minigame-complete', { detail }));\n    if (typeof window.FORPOST_MINIGAME_DONE === 'function') window.FORPOST_MINIGAME_DONE(detail);\n  },\n  skipWire(onSkip) {\n    document.querySelector('#skip').onclick = onSkip;\n    window.addEventListener('keydown', e => { if (e.code === 'Escape' && !MG.done) onSkip(); });\n  },\n  /* Масштаб полотна лише цілими кратними: пікселі не розпливаються. */\n  fit(canvas, w, h, maxScale) {\n    const box = canvas.parentElement;\n    const resize = () => {\n      const avail = Math.max(w, box.clientWidth);\n      const s = Math.max(1, Math.min(maxScale || 6, Math.floor(avail / w)));\n      canvas.style.width = (w * s) + 'px';\n      canvas.style.height = (h * s) + 'px';\n    };\n    resize(); window.addEventListener('resize', resize);\n  },\n  toLogical(canvas, e) {\n    const r = canvas.getBoundingClientRect();\n    return { x: (e.clientX - r.left) * canvas.width / r.width, y: (e.clientY - r.top) * canvas.height / r.height };\n  },\n  reduced: matchMedia('(prefers-reduced-motion: reduce)').matches,\n};\n/* Матриця Баєра 4x4 для дизеру. */\nconst BAYER4 = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];\nconst dith = (x, y, level) => level > (BAYER4[(y & 3) * 4 + (x & 3)] + 0.5) / 16;\n\n/* ---- Піксельні малюнки для коміксу «що робити» ---- */\nconst PIX = {\n  hand: ['#......','##.....','#+#....','#++#...','#+++#..','#++++#.','#+++++#','#++##..','#.#+#..','...##..'],\n  check: ['.......#','......##','#....##.','##..##..','.####...','..##....'],\n  astro: ['.####.','#+##+#','.####.','######','.####.','.#..#.','.#..#.'],\n  arrowR: ['....#...','....##..','########','########','....##..','....#...'],\n};\nfunction pxCtx(cv) { const c = cv.getContext('2d'); c.imageSmoothingEnabled = false; return c; }\nfunction sprite(c, rows, x, y, col) {\n  rows.forEach((r, j) => [...r].forEach((ch, i) => { if (ch === '#') { c.fillStyle = col || '#fff'; c.fillRect(x + i, y + j, 1, 1); } else if (ch === '+') { c.fillStyle = '#000'; c.fillRect(x + i, y + j, 1, 1); } }));\n}\nfunction box(c, x, y, w, h, col) { c.fillStyle = col || '#fff'; c.fillRect(x, y, w, 1); c.fillRect(x, y + h - 1, w, 1); c.fillRect(x, y, 1, h); c.fillRect(x + w - 1, y, 1, h); }\nfunction dots(c, x, y, w, h, lvl) { c.fillStyle = '#fff'; for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) if (dith(x + i, y + j, lvl)) c.fillRect(x + i, y + j, 1, 1); }\nfunction howStrip(host, frames, mini) {\n  host.classList.add('howstrip'); if (mini) host.classList.add('mini');\n  host.innerHTML = frames.map((f, i) => `<div class=\"hf\"><span class=\"n\">${i + 1}</span><canvas width=\"48\" height=\"32\" aria-hidden=\"true\"></canvas><span>${f.t}</span></div>`).join('');\n  host.querySelectorAll('canvas').forEach((cv, i) => { const c = pxCtx(cv); c.fillStyle = '#000'; c.fillRect(0, 0, 48, 32); frames[i].draw(c); });\n}\n\n\n\n\n(() => {\n  const TIME = 20, PERFECT_LEFT = 8, CAP = 2, DOSE = {safe: 2, bad: 10, outside: 20};\n  const SPR = '<svg viewBox=\"0 0 8 11\" aria-hidden=\"true\"><rect class=\"b\" x=\"2\" y=\"0\" width=\"4\" height=\"4\" fill=\"#fff\"/><rect x=\"3\" y=\"1\" width=\"2\" height=\"2\" fill=\"#000\"/><rect class=\"b\" x=\"1\" y=\"4\" width=\"6\" height=\"4\" fill=\"#fff\"/><rect class=\"b\" x=\"2\" y=\"8\" width=\"1\" height=\"3\" fill=\"#fff\"/><rect class=\"b\" x=\"5\" y=\"8\" width=\"1\" height=\"3\" fill=\"#fff\"/></svg>';\n  // Стіни видно на малюнку: товсті заштриховані — захищають, тонка лінія — ні.\n  const thick = (c, x, y, w, h, t) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) { const edge = i < t || j < t || i >= w - t; if (edge && j < h - 1 && dith(x + i, y + j, .55)) { c.fillStyle = '#fff'; c.fillRect(x + i, y + j, 1, 1); } } box(c, x, y, w, h); };\n  const MODS = [\n    {id: 'glass', nm: 'СКЛО', safe: false, draw: c => { c.fillStyle = '#fff'; for (let a = 180; a <= 360; a += 4) c.fillRect(Math.round(24 + Math.cos(a * Math.PI / 180) * 16), Math.round(26 + Math.sin(a * Math.PI / 180) * 16), 1, 1); c.fillRect(6, 26, 36, 1); [16, 24, 32].forEach(x => { c.fillRect(x, 20, 1, 6); c.fillRect(x - 1, 20, 3, 1); }); }},\n    {id: 'soil', nm: 'ҐРУНТ', safe: true, draw: c => { thick(c, 6, 6, 36, 21, 6); c.fillStyle = '#fff'; c.fillRect(21, 19, 6, 7); }},\n    {id: 'water', nm: 'ВОДА', safe: true, draw: c => { thick(c, 6, 6, 36, 21, 6); c.fillStyle = '#000'; c.fillRect(13, 7, 22, 4); c.fillStyle = '#fff'; for (let x = 13; x < 35; x += 4) { c.fillRect(x, 9, 2, 1); c.fillRect(x + 2, 8, 2, 1); } c.fillRect(21, 19, 6, 7); }},\n    {id: 'metal', nm: 'МЕТАЛ', safe: false, draw: c => { box(c, 6, 8, 36, 19); c.fillStyle = '#fff'; for (let i = 0; i < 6; i++) c.fillRect(17 + i, 22 - i, 1, 1); c.fillRect(22, 15, 3, 1); c.fillRect(24, 15, 1, 3); }},\n  ];\n  const CREW = [{id: 'a', nm: 'ОЛЯ', at: null}, {id: 'b', nm: 'МАКС', at: null}, {id: 'c', nm: 'ЛІНА', at: null}];\n  let sel = null, left = TIME, running = false, last = 0, acc = 0, drag = null;\n\n  // комікс «що робити»\n  const astroPic = (c, x, y) => sprite(c, PIX.astro, x, y);\n  const FR = [\n    {t: 'ВІЗЬМИ АСТРОНАВТА', draw: c => { astroPic(c, 16, 10); sprite(c, PIX.hand, 22, 15); }},\n    {t: 'ТЯГНИ ДО ТОВСТИХ СТІН', draw: c => { astroPic(c, 3, 12); sprite(c, PIX.arrowR, 11, 13); thick(c, 22, 6, 22, 20, 5); }},\n    {t: 'ЗАЧИНИ ЛЮКИ', draw: c => { thick(c, 6, 6, 24, 20, 5); astroPic(c, 15, 12); sprite(c, PIX.check, 36, 12); }},\n  ];\n  howStrip(document.querySelector('#howBig'), FR);\n  howStrip(document.querySelector('#howMini'), FR, true);\n\n  const token = (p, extra) => `<button class=\"astro ${sel === p.id ? 'sel' : ''} ${extra || ''}\" data-astro=\"${p.id}\" aria-label=\"${p.nm}\">${SPR}${p.nm}</button>`;\n  function render() {\n    document.querySelector('#outside').innerHTML = '<span class=\"tag\">НАЗОВНІ</span>' + CREW.filter(p => !p.at).map(p => token(p)).join('');\n    const base = document.querySelector('#base');\n    base.innerHTML = MODS.map(m => { const inside = CREW.filter(p => p.at === m.id);\n      return `<div class=\"mod\" role=\"button\" tabindex=\"0\" data-mod=\"${m.id}\" aria-label=\"Модуль: ${m.nm}\"><canvas width=\"48\" height=\"32\" aria-hidden=\"true\"></canvas><span class=\"nm\">${m.nm}</span>\n        <span class=\"slots\">${[0, 1].map(i => `<span class=\"slot\">${inside[i] ? token(inside[i]) : ''}</span>`).join('')}</span></div>`; }).join('');\n    base.querySelectorAll('.mod').forEach((el, i) => { const c = pxCtx(el.querySelector('canvas')); c.fillStyle = '#000'; c.fillRect(0, 0, 48, 32); MODS[i].draw(c);\n      el.addEventListener('click', e => { if (e.target.closest('.astro')) return; place(el.dataset.mod); });\n      el.addEventListener('keydown', e => { if (e.target === el && (e.code === 'Enter' || e.code === 'Space')) { e.preventDefault(); place(el.dataset.mod); } }); });\n    document.querySelectorAll('.astro[data-astro]').forEach(b => {\n      b.addEventListener('click', () => { if (!running) return; sel = b.dataset.astro; render(); focusA(sel); });\n      b.addEventListener('pointerdown', startDrag);\n    });\n    document.querySelector('#seal').disabled = !running || CREW.some(p => !p.at);\n  }\n  const focusA = id => { const el = document.querySelector(`.astro[data-astro=\"${id}\"]`); if (el) el.focus(); };\n  function place(modId) {\n    if (!running || !sel) return;\n    const p = CREW.find(x => x.id === sel);\n    if (p.at !== modId && CREW.filter(x => x.at === modId).length >= CAP) return flash(modId);\n    p.at = modId; sel = null; render();\n  }\n  function flash(modId) { const el = document.querySelector(`.mod[data-mod=\"${modId}\"]`); if (!el) return; el.classList.add('over'); setTimeout(() => el.classList.remove('over'), 400); }\n  // перетягування пальцем або мишкою\n  function startDrag(e) {\n    if (!running) return;\n    const b = e.currentTarget, id = b.dataset.astro;\n    drag = {id, ghost: null, moved: false, x0: e.clientX, y0: e.clientY};\n    window.addEventListener('pointermove', moveDrag); window.addEventListener('pointerup', endDrag, {once: true});\n  }\n  function moveDrag(e) {\n    if (!drag) return;\n    if (!drag.moved && Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < 6) return;\n    if (!drag.moved) { drag.moved = true; const p = CREW.find(x => x.id === drag.id); const g = document.createElement('div'); g.className = 'astro ghost'; g.innerHTML = SPR + p.nm; document.body.appendChild(g); drag.ghost = g; }\n    drag.ghost.style.left = (e.clientX - 28) + 'px'; drag.ghost.style.top = (e.clientY - 20) + 'px';\n    document.querySelectorAll('.mod').forEach(m => m.classList.remove('over'));\n    const over = document.elementFromPoint(e.clientX, e.clientY)?.closest('.mod'); if (over) over.classList.add('over');\n  }\n  function endDrag(e) {\n    window.removeEventListener('pointermove', moveDrag);\n    if (!drag) return;\n    if (drag.moved) { const over = document.elementFromPoint(e.clientX, e.clientY)?.closest('.mod'); drag.ghost.remove(); document.querySelectorAll('.mod').forEach(m => m.classList.remove('over')); if (over) { sel = drag.id; place(over.dataset.mod); } }\n    drag = null;\n  }\n  function hud() { const s = Math.max(0, Math.ceil(left)); document.querySelector('#sec').textContent = s + ' С'; document.querySelector('#timeTxt').textContent = s + ' С'; document.querySelector('#timeBar').style.width = (left / TIME * 100) + '%'; }\n  function end(skipped) {\n    running = false; render();\n    if (skipped) return MG.finish(false, false, true, {});\n    const res = CREW.map(p => { const m = MODS.find(x => x.id === p.at); return {p, d: !m ? DOSE.outside : m.safe ? DOSE.safe : DOSE.bad}; });\n    const ok = res.every(r => r.d === DOSE.safe), perfect = ok && left >= PERFECT_LEFT;\n    const list = res.map(r => r.p.nm + ' +' + r.d).join(' · ');\n    if (ok) MG.finish(true, perfect, false, {eyebrow: 'УСІ В БЕЗПЕЦІ', title: perfect ? 'ВЧАСНО<br>Й НАДІЙНО' : 'УСІ<br>В УКРИТТІ', text: 'Доза: ' + list + '. +40 балів.'});\n    else MG.finish(false, false, false, {eyebrow: 'НЕ ВСІ СХОВАЛИСЯ', title: 'СПРОБУЙ<br>ЩЕ', text: 'Доза: ' + list + '. Шукай товсті стіни. День не постраждав, просто без бонусу.'});\n  }\n  function loop(now) {\n    if (!running) return;\n    const dt = Math.min(.1, (now - last) / 1000); last = now; left -= dt; acc += dt;\n    if (acc >= 1 / 12) { acc = 0; hud(); }\n    if (left <= 0) { left = 0; hud(); return end(false); }\n    requestAnimationFrame(loop);\n  }\n  document.querySelector('#seal').onclick = () => { if (running && CREW.every(p => p.at)) end(false); };\n  MG.skipWire(() => end(true));\n  render(); hud();\n  MG.start(() => { running = true; last = performance.now(); render(); focusA('a'); requestAnimationFrame(loop); });\n})();\n\n"}};
const MG_NAMES = {"dust": "Пилова буря", "tower": "Вежа до Сонця", "shelter": "Встигни в укриття"};
const MG_HOW = {"dust": "Протри всі три панелі від пилу, поки є час.", "tower": "Крути панель за Сонцем. Воно ховається за гори — чекай.", "shelter": "Розведи екіпаж по модулях із товстими стінами."};
function mgPixel(area, end, type){
 const P = MG_PAGES[type];

/* ===== Фон: мерехтливі зірки й піксельна планета. Єдина анімація (гайд, 2.4). ===== */
(function(){
 const cv=document.createElement('canvas'); cv.id='sky';
 cv.style.cssText='position:fixed;inset:0;width:100%;height:100%;z-index:-1;image-rendering:pixelated;pointer-events:none';
 document.body.appendChild(cv);
 const BAYER=[0,8,2,10,12,4,14,6,3,11,1,9,15,7,13,5];
 const dith=(x,y,l)=>l>(BAYER[(y&3)*4+(x&3)]+0.5)/16;
 const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
 let W=0,H=0,stars=[],c=cv.getContext('2d');
 function size(){
  W=cv.width=Math.ceil(innerWidth/3); H=cv.height=Math.ceil(innerHeight/3);
  stars=[]; const n=Math.round(W*H/900);
  for(let i=0;i<n;i++) stars.push({x:(Math.random()*W)|0,y:(Math.random()*H)|0,ph:Math.random()*6.28});
 }
 /* Піксельна куля в дизері: 12 кроків обертання, 120 с на оберт. */
 function planet(t){
  const R=Math.max(26,Math.min(64,Math.round(Math.min(W,H)/5)));
  const cx=W-R-6, cy=R+6, step=Math.floor(t/10)%12, off=step/12;
  c.fillStyle='#fff';
  for(let y=-R;y<=R;y++) for(let x=-R;x<=R;x++){
   const d=Math.hypot(x,y); if(d>R) continue;
   const nz=Math.sqrt(1-Math.min(1,(d/R)*(d/R)));
   const lon=(Math.atan2(x,nz)/Math.PI+off)*4;
   const band=0.5+0.34*Math.sin(lon*3.1)+0.18*Math.sin(y/R*5.3);
   const light=Math.max(0,(-x/R)*0.45+nz*0.62);
   if(dith(cx+x,cy+y,Math.max(0,Math.min(1,light*band))))
    c.fillRect(cx+x,cy+y,1,1);
  }
  c.fillStyle='#555';
  for(let a=0;a<360;a+=4){const x=Math.round(cx+Math.cos(a*Math.PI/180)*R),y=Math.round(cy+Math.sin(a*Math.PI/180)*R);c.fillRect(x,y,1,1);}
 }
 function frame(ms){
  const t=ms/1000;
  c.fillStyle='#000'; c.fillRect(0,0,W,H);
  for(const s of stars){
   const tw=reduced?1:(Math.sin(t*1.2+s.ph)>0?1:0.45);
   c.fillStyle= tw>0.7 ? '#fff' : '#555';
   c.fillRect(s.x,s.y,1,1);
  }
  planet(reduced?0:t);
  setTimeout(()=>requestAnimationFrame(frame), reduced?100000:200);   /* ступінчасто, не плавно */
 }
 addEventListener('resize',size); size(); requestAnimationFrame(frame);
})();

function finishComic(){
 const r=S.result, day=S.day, el=document.getElementById('res'); if(!el||el.dataset.done) return;
 el.dataset.done=1; S.comicDone=true;
 const hd=document.querySelector('.steps'); if(hd) hd.outerHTML=dayHead().match(/<div class="steps">[\s\S]*?<\/div>/)[0];
 const p=player(); S.newAch=[];
 const okRows=r.brk?r.rows.slice(0,r.brk.i):r.rows;
 const mainOk=okRows.filter(x=>x.b.k==='main').length, mainAll=day.tasks.filter(t=>t.k==='main').length;
 const exAll=day.tasks.filter(t=>t.k==='extra'), exOk=r.extrasDone;
 const mgWon=Object.values(S.mgRes).filter(m=>m.win).length;
 if(!r.brk){
  const base=r.pts+mgWon*MG_BONUS, mult=S.hints?1:NOHINT_MULT, final=Math.round(base*mult);
  S.total+=final; S.stats[p].pts+=final; S.stats[p].days++;
  const ptsEl=document.getElementById('pts'); if(ptsEl) ptsEl.textContent=S.total;
  S.mgWins+=mgWon;
  exOk.forEach(id=>S.extrasDone.add(id));
  const notDone=exAll.filter(t=>t.carry&&!exOk.includes(t.id));
  S.carry=notDone.map(t=>({...t,carried:0}));
  const factKey=S.M.id+':'+S.di, newFact=!FACTS.has(factKey); FACTS.add(factKey);
  S.dayFacts.push({di:S.di, t:day.D.t, story:day.D.story, comp:day.comp?day.comp:null, src:day.D.src});
  WORLDS.add(S.locId); saveMeta();
  // досягнення
  unlock('first');
  if(!r.pens.length && !r.partial) unlock('clean');
  if(exAll.length && exOk.length===exAll.length) unlock('science');
  if(day.comp) unlock('storm');
  if(!S.hints) unlock('nohint');
  if(day.start+day.len-r.end>=120) unlock('spare');
  if(Object.values(S.mgRes).some(m=>m.win&&m.type==='aim'&&m.perfect)) unlock('aim');
  if(S.mgWins>=5) unlock('hands');
  if(S.prevFail && S.prevFail.player!==p) unlock('team');
  if(WORLDS.size>=3) unlock('worlds');
  if(S.attempts>0 && S.prevFail && S.prevFail.player===p) unlock('retry');
  /* --- нові досягнення: усе з achMetrics --- */
  const AM=achMetrics(day, r, S.L);
  if(AM.o2left!==null){
   if(AM.o2left>=45) unlock('o2spare');
   if(AM.o2left<20) unlock('o2edge');
   if(day.suitMax && AM.o2used<=day.suitMax/2) unlock('o2half');
   if(AM.o2used>=240) unlock('marathon');
  }
  if(AM.noLoop) unlock('noloop');
  if(AM.farDone) unlock('farzone');
  if(AM.travel<30) unlock('light');
  if(AM.outZones>=3) unlock('threez');
  if(AM.commSlack!==null && AM.commSlack<=10) unlock('window');
  if(AM.commPerfect) unlock('commall');
  if(day.blackout) unlock('dark');
  if(AM.fixedN>=1 && AM.wait===0) unlock('nowait');
  if(AM.fixedN>=1 && !r.pens.length) unlock('ontime');
  if(AM.startBySlack!==null && AM.startBySlack<=20 && !r.pens.length) unlock('jit');
  if(AM.dur<=360) unlock('cheap');
  if(AM.crewUSD<700000) unlock('crew');
  if(AM.cutSuit) unlock('dustday');
  if(AM.cutLen) unlock('shortday');
  if(AM.addedLos) unlock('norelay');
  if(exAll.length && exOk.length===exAll.length && !r.pens.length && !r.partial) unlock('full');
  if(r.partial) unlock('priority');
  if(day.comp){ SEEN.add(S.locId+':'+day.comp.t); if(SEEN.size>=10) unlock('chronicler'); }
  if(FACTS.size>=15) unlock('archivist');
  const last=S.di===S.M.days.length-1;
  if(last){
   unlock('mission'); if(S.fails===0) unlock('flawless');
   if(S.M.level>=3) unlock('expert');
   if(!S.hints) unlock('hardcore');
   MISS.add(S.M.id);
   const got=id=>MISS.has(id);
   if(got('iss-power')&&got('iss-routine')) unlock('station');
   if(got('a11')&&got('a15')&&got('a17')) unlock('apollo');
   if(got('chapea')&&got('jezero')) unlock('martian');
   if(MISS.size>=7) unlock('forpost');
  }
  saveMeta();
  S.prevFail=null; S.attempts=0;
  const lines=[
   ['Обов’язкові завдання', mainOk+' з '+mainAll, mainOk*P.main],
   ['Побут', okRows.filter(x=>x.b.k==='life').length+' з '+day.tasks.filter(t=>t.k==='life').length, okRows.filter(x=>x.b.k==='life').length*P.life],
   ['Додаткові · бонус', exOk.length+' з '+exAll.length, exOk.length*P.extra],
   r.partial ? ['День зараховано частково', 'не встиг: '+r.partial.map(x=>'«'+x.n+'»').join(', '), P.half]
             : ['День зараховано', '', P.pass],
  ];
  if(day.comp) lines.push(['Ускладнення «'+day.comp.t+'»','подолано',P.comp]);
  if(S.mgQueue.length) lines.push(['Міні-ігри', mgWon+' з '+S.mgQueue.length, mgWon*MG_BONUS]);
  if(r.pens.length) lines.push(['Штрафи', r.pens.length+' × '+P.pen, r.pens.length*P.pen]);
  if(mult!==1) lines.push(['Без підказок','×1,5', final-base]);
  const achHTML = S.newAch.length ? S.newAch.map(id=>achBadge(ACH_DEF.find(a=>a.id===id),true,true)).join('') : '<p class="muted" style="margin:0;font-size:13.5px">Нових досягнень цього разу немає. Наступне, яке можна взяти: '+esc((ACH_DEF.find(a=>!ACH.has(a.id))||{n:'усі зібрано'}).n)+'.</p>';
  el.innerHTML='<div class="result ok"><div class="rhead"><div><span class="eyebrow">Вікно результатів</span><h3>День зараховано</h3></div><div class="score">+'+final+'<small>'+esc(p)+'</small></div></div>'+
   '<div class="rgrid"><div class="rbox"><h4>Підсумок дня</h4><table class="sc">'+lines.map(l=>'<tr><td>'+esc(l[0])+'</td><td class="muted">'+esc(l[1])+'</td><td class="mono">'+(l[2]>=0?'+':'')+l[2]+'</td></tr>').join('')+'</table>'+(notDone.length?'<p class="carry">Переходить на завтра: '+notDone.map(t=>'«'+esc(t.n)+'»').join(', ')+'</p>':'')+'</div>'+
   '<div class="rbox"><h4>Досягнення</h4><div class="achs col">'+achHTML+'</div></div>'+
   '<div class="rbox fact"><h4>'+(newFact?'Новий факт відкрито':'Цікавий факт')+'</h4><p>'+esc(day.D.story)+'</p>'+(day.comp&&day.comp.real?'<p><b>Про ускладнення.</b> '+esc(day.comp.real)+'</p>':'')+'<span class="src">Джерело: '+esc(day.D.src)+'</span></div></div>'+
   '<div class="act">'+(!last?'<button class="btn" data-a="next">Наступний день →</button>':'<button class="btn" data-a="finish">Підсумок місії →</button>')+'</div></div>';
 } else {
  S.fails++; S.stats[p].fails++; S.attempts++;
  const [h,why]=failText(r.brk);
  const next=S.players[(S.pi+1)%S.players.length];
  const at=r.brk.end?'наприкінці дня':'о '+fmt(r.brk.at)+', на кадрі '+(r.brk.i+1);
  S.prevFail={player:p, short:'Злам стався '+at+': '+h};
  const tip = S.hints ? 'Підказка: подивись на блок, де стався злам, і на те, що стоїть перед ним.' : 'Режим без підказок: якщо застрягли, на екрані вибору місії можна ввімкнути підказки.';
  el.innerHTML='<div class="result bad"><div class="rhead"><div><span class="eyebrow">Вікно результатів</span><h3>День провалено '+esc(at)+'</h3></div><div class="score bad">✕<small>'+esc(p)+'</small></div></div>'+
  '<div class="rgrid two"><div class="rbox"><h4>Що сталося</h4><p><b>'+esc(h)+'</b></p>'+(why?'<p class="muted">'+esc(why)+'</p>':'')+'<p class="muted">До зламу: '+(r.brk.end?r.rows.length:r.brk.i)+' '+plural(r.brk.end?r.rows.length:r.brk.i,'кадр','кадри','кадрів')+', обов’язкових — '+mainOk+' з '+mainAll+'. Бали за день не зараховуються.</p></div>'+
  '<div class="rbox"><h4>Хто далі</h4><p>Наступним грає <b>'+esc(next)+'</b>. ЦУП розповість, що зламав попередник, і день почнеться спочатку. Завдання знову перемішаються.</p><p class="muted">'+tip+'</p></div></div>'+
  '<div class="act"><button class="btn" data-a="nextplayer">Передати план: '+esc(next)+' →</button><button class="btn ghost" data-a="sameplayer">Переграти самому</button></div></div>';
 }
 bind(el);
 el.scrollIntoView({block:'start',behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});
}

 aim:{h:'Точне наведення', how:'Маркер ходить шкалою. Натисни «Стоп», коли він у зеленій зоні. Три спроби.'},

let mgCleanup=null;
function openMG(idx, done){
 const row=S.result.rows[idx], b=row.b, type=b.mg,
       meta=MG_PAGES[type] ? {h:MG_NAMES[type], how:MG_HOW[type]} : MG_META[type];
 const wrap=document.createElement('div'); wrap.className='modal'; wrap.setAttribute('role','dialog'); wrap.setAttribute('aria-modal','true');
 wrap.innerHTML='<div class="mgcard"><div class="mghead"><span class="eyebrow">Міні-гра · +'+MG_BONUS+' балів · '+fmt(row.start)+'</span><h3>'+meta.h+': «'+esc(b.n)+'»</h3><p>'+meta.how+'</p></div><div class="mgarea" id="mgarea"></div><div class="mgfoot"><span class="mgmsg" id="mgmsg" aria-live="polite"></span><button class="btn ghost sm" id="mgskip">Пропустити</button></div></div>';
 document.body.appendChild(wrap);
 const area=wrap.querySelector('#mgarea'), msg=wrap.querySelector('#mgmsg'), skip=wrap.querySelector('#mgskip');
 let finished=false;
 const end=(win, perfect)=>{
  if(finished) return; finished=true;
  if(mgCleanup){ mgCleanup(); mgCleanup=null; }
  S.mgRes[idx]={win, perfect:!!perfect, type};
  msg.textContent = win ? (perfect?'Ідеально! +'+MG_BONUS+' балів.':'Готово! +'+MG_BONUS+' балів.') : 'Цього разу без бонусу. День триває.';
  skip.textContent='Далі →'; skip.classList.remove('ghost');
  skip.onclick=()=>{ wrap.remove(); done(); };
  skip.focus();
 };
 skip.onclick=()=>end(false);
 if(MG_PAGES[type]) mgCleanup=mgPixel(area,end,type);
 else if(type==='aim') mgAim(area,end); else if(type==='puzzle') mgPuzzle(area,end,row); else mgMemory(area,end);
 setTimeout(()=>{ const f=area.querySelector('button'); if(f) f.focus(); },50);
}
function mgAim(area,end){
 const zoneL=15+Math.random()*60, zoneW=14;
 area.innerHTML='<div class="aim"><div class="track"><div class="zone" style="left:'+zoneL+'%;width:'+zoneW+'%"></div><div class="mark" id="mark"></div></div><div class="aimrow"><span class="tries" id="tries">Спроби: ●●●</span><button class="btn" id="stop">Стоп!</button></div></div>';
 const mark=area.querySelector('#mark'), tries=area.querySelector('#tries'), stop=area.querySelector('#stop');
 let x=0, dir=1, left=3, raf=0, last=performance.now(), hold=false;
 const speed=matchMedia('(prefers-reduced-motion: reduce)').matches?28:62;
 const tick=t=>{ const dt=(t-last)/1000; last=t; if(!hold){ x+=dir*speed*dt; if(x>=100){x=100;dir=-1;} if(x<=0){x=0;dir=1;} mark.style.left=x+'%'; } raf=requestAnimationFrame(tick); };
 raf=requestAnimationFrame(tick);
 const press=()=>{
  if(hold||left<=0) return;
  const hit=x>=zoneL-1&&x<=zoneL+zoneW+1; left--;
  tries.textContent='Спроби: '+'●'.repeat(left)+'○'.repeat(3-left);
  if(hit){ hold=true; mark.classList.add('hit'); end(true, left===2); return; }
  mark.classList.add('miss'); hold=true; setTimeout(()=>{ mark.classList.remove('miss'); hold=false; },450);
  if(left===0){ hold=true; end(false); }
 };
 stop.onclick=press;
 const key=e=>{ if(e.code==='Space'){ e.preventDefault(); press(); } };
 document.addEventListener('keydown',key);
 mgCleanup=()=>{ cancelAnimationFrame(raf); document.removeEventListener('keydown',key); };
}
function mgPuzzle(area,end,row){
 const zi=S.day.env.zones[row.loc]||{};
 const full=scene(zi.sc||'iss-in', row.b.ic, {seed:hash(row.b.id), suit:row.suit});
 const inner=full.replace(/^<svg[^>]*>/,'').replace(/<\/svg>$/,'');
 let perm; do{ perm=shuffle([0,1,2,3,4,5,6,7,8], Math.random); }while(perm.filter((p,i)=>p===i).length>2);
 let sel=null, moves=0;
 const draw=()=>{
  area.innerHTML='<div class="pz">'+perm.map((p,pos)=>'<button class="tile'+(sel===pos?' sel':'')+(p===pos?' ok':'')+'" data-pos="'+pos+'" aria-label="Шматок '+(pos+1)+'"><svg viewBox="'+(p%3)*100+' '+Math.floor(p/3)*60+' 100 60" preserveAspectRatio="none">'+inner+'</svg></button>').join('')+'</div><p class="mgsub">Ходів: '+moves+'</p>';
  area.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
   const pos=+t.dataset.pos;
   if(sel===null){ sel=pos; draw(); return; }
   if(sel!==pos){ [perm[sel],perm[pos]]=[perm[pos],perm[sel]]; moves++; }
   sel=null; draw();
   if(perm.every((p,i)=>p===i)){ area.querySelector('.pz').classList.add('solved'); end(true, moves<=8); }
  });
 };
 draw();
}
function mgMemory(area,end){
 const icons=MG_ICONS[S.locId]||MG_ICONS.iss;
 const cards=shuffle(icons.concat(icons), Math.random).map(ic=>({ic, open:false, done:false}));
 let first=null, lock=false, moves=0;
 const draw=()=>{
  area.innerHTML='<div class="mem">'+cards.map((c,i)=>'<button class="card'+(c.open||c.done?' open':'')+(c.done?' done':'')+'" data-i="'+i+'" aria-label="Картка '+(i+1)+'">'+(c.open||c.done?'<svg viewBox="-24 -24 48 48">'+iconSVG(c.ic,1)+'</svg>':'<span>?</span>')+'</button>').join('')+'</div><p class="mgsub">Ходів: '+moves+'</p>';
  area.querySelectorAll('.card').forEach(el=>el.onclick=()=>{
   const i=+el.dataset.i, c=cards[i];
   if(lock||c.open||c.done) return;
   c.open=true;
   if(first===null){ first=i; draw(); return; }
   moves++; const a=cards[first];
   if(a.ic===c.ic){ a.done=c.done=true; a.open=c.open=false; first=null; draw();
    if(cards.every(x=>x.done)) end(true, moves<=9);
   } else { lock=true; draw(); setTimeout(()=>{ a.open=c.open=false; first=null; lock=false; draw(); },700); }
  });
 };
 draw();
}

/* ---------- Події ---------- */
function readPlayers(){
 const inp=document.getElementById('players'); if(!inp) return;
 const list=inp.value.split(',').map(s=>s.trim()).filter(Boolean);
 S.players=list.length?list.slice(0,8):['Гравець 1'];
}
function act(a,v){
 switch(a){
  case 'home': clearTimeout(briefTimer); clearTimeout(comicTimer); S.view='home'; render(); break;
  case 'loc': readPlayers(); S.locId=v; S.view='loc'; render(); break;
  case 'mode': S.hints = v==='1'; render(); break;
  case 'start': startMission(S.locId,v); break;
  case 'voice': speakAll(); break;
  case 'skip': skipBrief(); break;
  case 'toplan': clearTimeout(briefTimer); stopVoice(); S.phase='plan'; render(); break;
  case 'rebrief': S.phase='brief'; S.briefShown=0; render(); playBrief(); break;
  case 'toggle': { const i=S.plan.indexOf(v); if(i>=0) S.plan.splice(i,1); else S.plan.push(v); refreshBoard(); break; }
  case 'up': { const j=+v; if(j>0){[S.plan[j-1],S.plan[j]]=[S.plan[j],S.plan[j-1]];} refreshBoard(); break; }
  case 'down': { const j=+v; if(j<S.plan.length-1){[S.plan[j+1],S.plan[j]]=[S.plan[j],S.plan[j+1]];} refreshBoard(); break; }
  case 'clear': S.plan=[]; refreshBoard(); break;
  case 'launch': if(S.plan.length) launch(); break;
  case 'skipc': skipComic(); break;
  case 'next': S.di++; enterDay(); break;
  case 'finish': S.view='end'; render(); break;
  case 'nextplayer': S.pi=(S.pi+1)%S.players.length; enterDay(); break;
  case 'sameplayer': { const keep=S.plan.slice(); enterDay(); S.plan=keep; break; }
  case 'restart': startMission(S.locId,S.M.id); break;
 }
}
function bind(root){
 (root||$app).querySelectorAll('[data-a]').forEach(el=>{ if(el.dataset.bound) return; el.dataset.bound=1; el.addEventListener('click',e=>{e.preventDefault();act(el.dataset.a,el.dataset.v);}); });
 if(!root&&S.view==='day'&&S.phase==='brief') renderBriefParts();
 if(!root&&S.view==='day'&&S.phase==='plan') bindSortable();
}
document.addEventListener('click',e=>{ const el=e.target.closest('#board [data-a]'); if(el&&!el.dataset.bound){ e.preventDefault(); act(el.dataset.a,el.dataset.v); } });
document.addEventListener('input',e=>{ if(e.target.id==='players') readPlayers(); });
if('speechSynthesis' in window){ try{ speechSynthesis.getVoices(); }catch(e){} }
render();

</script>
