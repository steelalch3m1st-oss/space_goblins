<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Космічна зміна</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Handjet:wght@400;500;700;800&family=Press+Start+2P&display=swap">
<style>
/* Layout: a crew tablet in the dark of space. Three phases per day — Earth call, planner, comic strip printed on newsprint panels. Single committed dark look. */
:root{
  color-scheme: dark;
  /* «Піксельний місяць»: лише чорний, білий і три сірих. Жодних інших кольорів. */
  --void:#000; --deck:#000; --deck2:#000; --deck3:#000; --line:#555; --line2:#555;
  --ink:#fff; --ink2:#9a9a9a; --ink3:#9a9a9a;
  --signal:#fff; --signal-ink:#000;
  --main:#fff; --extra:#fff; --life:#fff; --crit:#fff; --pen:#9a9a9a;
  --iss:#fff; --moon:#fff; --mars:#fff;
  --paper:#000; --paper2:#000; --k:#fff;
  --empty:#222;
  --f-display:'Handjet',monospace;
  --f-body:'Handjet','Courier New',monospace;
  --f-mono:'Press Start 2P','Courier New',monospace;
  --f-comic:'Handjet','Courier New',monospace;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0;background:#000;color:var(--ink);font-family:var(--f-body);font-size:12px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--signal);outline-offset:2px}
.app{max-width:1280px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.01em}
.eyebrow{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink3)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink2)}

/* top bar */
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 14px;border:1px solid var(--line);border-radius:14px;background:#000;backdrop-filter:blur(6px)}
.brand{font-family:var(--f-display);font-weight:900;font-size:15px;letter-spacing:.02em;display:flex;align-items:center;gap:10px}
.brand i{display:inline-block;width:14px;height:14px;border-radius:50%;background:conic-gradient(var(--signal) 0 25%,transparent 0 50%,var(--signal) 0 75%,transparent 0);box-shadow:0 0 0 2px var(--signal) inset}
.top .sp{flex:1}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);font-size:10px;color:var(--ink2);white-space:nowrap}
.chip b{color:var(--ink);font-weight:600}
.chip.pl{border-color:var(--signal);color:var(--signal)}
.chip.pl b{color:var(--signal)}

.btn{border:0;border-radius:10px;padding:11px 18px;font-weight:600;font-size:10px;background:var(--signal);color:var(--signal-ink);display:inline-flex;align-items:center;gap:8px;justify-content:center;transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2)}
.btn.ghost:hover{border-color:var(--ink3);filter:none}
.btn.sm{padding:7px 12px;font-size:10px;border-radius:8px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.link{background:none;border:0;padding:0;color:var(--ink2);font-size:10px;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}

/* home */
.hero{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:24px;align-items:end;padding:26px 4px 6px}
.hero h1{font-size:clamp(30px,5vw,58px);font-weight:900;line-height:1.02}
.hero h1 span{color:var(--signal)}
.hero p{max-width:60ch;color:var(--ink2);margin:14px 0 0;font-size:12px}
.crew{border:1px solid var(--line);border-radius:14px;padding:16px;background:var(--deck);display:flex;flex-direction:column;gap:10px}
.crew label{font-size:10px;color:var(--ink2)}
.crew input{width:100%;background:var(--void);border:1px solid var(--line2);border-radius:8px;padding:10px 12px;color:var(--ink);font:inherit}
.crew small{color:var(--ink3);font-size:10px}
.locs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.loc{border:1px solid var(--line);border-radius:18px;overflow:hidden;background:var(--deck);display:flex;flex-direction:column;text-align:left;padding:0;transition:transform .18s,border-color .18s}
.loc:hover{transform:translateY(-3px);border-color:var(--lc)}
.loc .art{max-width:100%;display:block;background:#000}
.loc .art svg{display:block;width:100%;height:100%}
.loc .bd{padding:16px 18px 18px;display:flex;flex-direction:column;gap:8px;flex:1}
.loc h2{font-size:26px;color:var(--lc)}
.loc .full{font-size:10px;color:var(--ink3);font-family:var(--f-mono)}
.loc p{margin:0;color:var(--ink2);font-size:10px}
.loc .go{margin-top:auto;padding-top:8px;font-weight:600;color:var(--lc);font-size:10px}
.how{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.how div{border-top:2px solid var(--line2);padding-top:10px}
.how b{display:block;font-family:var(--f-display);font-size:13px;margin-bottom:4px}
.how span{color:var(--ink2);font-size:10px}
.how em{font-style:normal;font-family:var(--f-mono);color:var(--signal);font-size:10px;display:block;margin-bottom:6px}

/* missions */
.lochead{display:flex;gap:16px;align-items:flex-end;flex-wrap:wrap}
.lochead h1{font-size:clamp(28px,4vw,44px);color:var(--lc)}
.lochead p{margin:6px 0 0;color:var(--ink2);max-width:62ch}
.missions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.mis{border:1px solid var(--line);border-radius:16px;background:var(--deck);padding:20px;display:flex;flex-direction:column;gap:12px}
.mis h3{font-size:21px}
.mis .basis{font-family:var(--f-mono);font-size:10px;color:var(--ink3)}
.mis .real{font-size:10px;color:var(--ink2);border-left:2px solid var(--lc);padding-left:10px}
.mis .cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.mis ul{margin:6px 0 0;padding-left:18px;font-size:10px;color:var(--ink)}
.mis li{margin:2px 0}
.mis .ml{color:var(--main)} .mis .el{color:var(--extra)}
.mis .days{display:flex;gap:6px;flex-wrap:wrap}
.dpill{font-family:var(--f-mono);font-size:10px;padding:3px 8px;border-radius:6px;border:1px solid var(--line2);color:var(--ink2)}
.dpill.c{border-color:var(--crit);color:var(--crit)}
.mis .ft{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:auto}

/* day header & stepper */
.dayhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dayhead h2{font-size:clamp(20px,2.6vw,28px)}
.steps{display:flex;gap:4px;margin-left:auto;flex-wrap:wrap}
.steps span{font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;padding:6px 10px;border-radius:8px;color:var(--ink3);border:1px solid var(--line)}
.steps span.on{color:var(--signal-ink);background:var(--signal);border-color:var(--signal)}
.steps span.done{color:var(--ink2);border-color:var(--line2)}
.dots{display:flex;gap:5px;align-items:center}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dots i.ok{background:var(--life)} .dots i.cur{background:var(--signal)} .dots i.c{outline:1px solid var(--crit);outline-offset:1px}

/* briefing */
.brief{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:16px}
.call{border-radius:18px;overflow:hidden;border:1px solid var(--line);background:var(--deck);display:flex;flex-direction:column}
.screen{position:relative;background:linear-gradient(180deg,#000,#000);aspect-ratio:16/8.2;max-width:100%;overflow:hidden}
.screen svg.face{position:absolute;inset:0;width:100%;height:100%}
.screen .badge{position:absolute;top:12px;left:12px;display:flex;gap:8px;align-items:center;font-family:var(--f-mono);font-size:10px;background:#000;padding:5px 9px;border-radius:6px}
.screen .badge i{width:8px;height:8px;border-radius:50%;background:var(--crit);animation:blink 1.2s infinite}
.screen .who{position:absolute;bottom:12px;left:12px;background:#000;padding:7px 11px;border-radius:8px;font-size:10px}
.screen .who b{display:block;font-family:var(--f-display);font-size:13px}
.screen .who span{color:var(--ink2);font-size:10px}
.screen .clock{position:absolute;top:12px;right:12px;font-family:var(--f-mono);font-size:10px;background:#000;padding:5px 9px;border-radius:6px}
.screen.retro svg.face{filter:sepia(.55) contrast(1.05)}
.screen.rec .badge i{background:var(--extra);animation:none}
.mouth{transform-origin:center;transform-box:fill-box}
.subs{padding:14px 16px 16px;display:flex;flex-direction:column;gap:8px;min-height:220px;max-height:420px;overflow:auto}
.sub{font-size:12px;line-height:1.55;animation:fadeup .35s ease both}
.sub.warn{border:1px solid var(--crit);background:#000;border-radius:10px;padding:10px 12px}
.sub.warn b{color:var(--crit);font-family:var(--f-display);font-size:12.5px;letter-spacing:.04em;display:block;margin-bottom:2px}
.sub.prev{border:1px dashed var(--pen);border-radius:10px;padding:10px 12px;color:var(--pen)}
.callbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 16px;border-top:1px solid var(--line);align-items:center}
.callbar .sp{flex:1}

.planner{border:1px solid var(--line);border-radius:18px;background:var(--deck);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.planner h3{font-size:10px;letter-spacing:.04em}
.pgroup{display:flex;flex-direction:column;gap:6px}
.pgroup>.eyebrow{margin-top:6px}
.pi{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--deck2);border:1px solid transparent;animation:fadeup .35s ease both;text-align:left;width:100%}
.pi .k{width:8px;height:8px;border-radius:50%}
.pi .nm{font-size:10px;min-width:0}
.pi .nm small{display:block;color:var(--ink3);font-size:10px;font-family:var(--f-mono)}
.pi .du{font-family:var(--f-mono);font-size:10px;color:var(--ink2)}
.k.main{background:var(--main)} .k.extra{background:var(--extra)} .k.life{background:var(--life)} .k.trap,.k.blocked{background:var(--ink3)}
.pi.trap .nm,.pi.blocked .nm{text-decoration:line-through;color:var(--ink3)}
.pi.carried{border-color:#555}
.pi.comp{border-color:#9a9a9a}
.flags{display:inline-flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.fl{font-family:var(--f-mono);font-size:10px;padding:1px 6px;border-radius:4px;background:var(--deck3);color:var(--ink2)}
.fl.fx{color:var(--signal)} .fl.cm{color:var(--extra)} .fl.out{color:var(--mars)} .fl.cr{color:var(--crit)}

/* planning */
.plan{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:16px;align-items:start}
.pool .pi{cursor:pointer}
.pool .pi:hover{border-color:var(--line2)}
.pool .pi.in{opacity:.5}
.pool .pi.in .du::after{content:' ✓';color:var(--life)}
.pool .pi .add{font-family:var(--f-mono);font-size:12px;color:var(--ink2);width:22px;text-align:center}
.board{border:1px solid var(--line);border-radius:18px;background:var(--deck);padding:16px;display:flex;flex-direction:column;gap:14px;min-width:0}
.bar-wrap{overflow-x:auto}
.bar{position:relative;height:50px;border-radius:8px;background:var(--deck2);min-width:560px;overflow:hidden}
.bar .seg{position:absolute;top:8px;bottom:8px;border-radius:3px}
.bar .seg.main{background:var(--main)} .bar .seg.extra{background:var(--extra)} .bar .seg.life{background:var(--life)} .bar .seg.trap{background:var(--ink3)} .bar .seg.blocked{background:var(--crit)}
.bar .seg.tr{background:repeating-linear-gradient(135deg,var(--line2) 0 3px,transparent 3px 6px)}
.bar .seg.wt{background:repeating-linear-gradient(90deg,var(--ink3) 0 1px,transparent 1px 5px);opacity:.6}
.bar .los{position:absolute;top:0;bottom:0;background:#222;border-left:1px dashed var(--crit);border-right:1px dashed var(--crit)}
.bar .los span{position:absolute;top:1px;left:3px;font-family:var(--f-mono);font-size:8px;color:var(--crit);white-space:nowrap}
.bar .cut{position:absolute;top:0;bottom:0;width:2px;background:var(--crit)}
.bar .over{position:absolute;top:0;bottom:0;background:repeating-linear-gradient(45deg,#555 0 6px,transparent 6px 12px)}
.ticks{position:relative;height:16px;min-width:560px;font-family:var(--f-mono);font-size:10px;color:var(--ink3)}
.ticks span{position:absolute;transform:translateX(-50%)}
.ticks span:first-child{transform:none}
.ticks span.lastt{transform:translateX(-100%)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:10px;color:var(--ink2)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.sum{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.stat{font-size:10px;padding:6px 10px;border-radius:8px;background:var(--deck2);color:var(--ink2)}
.stat b{color:var(--ink);font-family:var(--f-mono)}
.stat.bad b{color:var(--crit)} .stat.ok b{color:var(--life)}
.rows{display:flex;flex-direction:column;gap:4px;min-height:80px}
.rows .empty{border:1px dashed var(--line2);border-radius:12px;padding:26px;text-align:center;color:var(--ink3);font-size:10px}
.pr{display:grid;grid-template-columns:22px 52px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 10px;border-radius:10px;background:var(--deck2);border-left:3px solid var(--line2)}
.pr.main{border-left-color:var(--main)} .pr.extra{border-left-color:var(--extra)} .pr.life{border-left-color:var(--life)} .pr.trap{border-left-color:var(--ink3)} .pr.blocked{border-left-color:var(--crit)}
.pr .h{cursor:grab;color:var(--ink3);font-size:12px;line-height:1;user-select:none;text-align:center}
.pr .tm{font-family:var(--f-mono);font-size:10px;color:var(--ink)}
.pr .tm.lt{color:var(--crit)}
.pr .nm{font-size:10px;min-width:0}
.pr .nm small{display:block;color:var(--ink3);font-size:10px;font-family:var(--f-mono)}
.pr .ctl{display:flex;gap:2px}
.pr .ctl button{background:transparent;border:1px solid var(--line);border-radius:6px;width:28px;height:28px;color:var(--ink2);font-size:10px;padding:0}
.pr .ctl button:hover{color:var(--ink);border-color:var(--ink3)}
.trv{font-family:var(--f-mono);font-size:10px;color:var(--ink3);padding:0 0 0 94px}
.trv.wt{color:var(--signal)}
.sortable-ghost{opacity:.35}
.launch{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:14px}
.launch .note{font-size:10px;color:var(--ink2);flex:1;min-width:200px}
.launch .note.warn{color:var(--pen)}
.tip{font-size:10px;color:var(--ink3)}

/* comic */
.comicwrap{border-radius:18px;background:var(--paper2);padding:18px;border:1px solid var(--line)}
.comichead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;color:var(--k);margin-bottom:14px}
.comichead h2{font-family:var(--f-display);font-weight:900;font-size:clamp(18px,2.4vw,26px);text-transform:uppercase;letter-spacing:.02em}
.comichead span{font-family:var(--f-comic);font-size:12px;color:#222}
.comichead .sp{flex:1}
.comic{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.panel{position:relative;background:var(--paper);border:3px solid var(--k);box-shadow:5px 5px 0 var(--k);display:flex;flex-direction:column;overflow:hidden;animation:pop .38s cubic-bezier(.2,1.4,.4,1) both;color:var(--k)}
.panel:nth-child(3n+1){transform:rotate(-.6deg)} .panel:nth-child(3n+2){transform:rotate(.5deg)}
.panel .pic{aspect-ratio:300/180;max-width:100%;border-bottom:3px solid var(--k);background:#000}
.panel .pic svg{display:block;width:100%;height:100%}
.panel .t{position:absolute;top:8px;left:8px;background:#fff;border:2px solid var(--k);font-family:var(--f-mono);font-weight:600;font-size:10px;padding:1px 6px;color:var(--k)}
.panel .mv{position:absolute;top:8px;right:8px;background:var(--paper);border:2px solid var(--k);font-family:var(--f-comic);font-size:13px;padding:0 6px;max-width:62%;text-align:right;color:var(--k)}
.panel .tx{padding:9px 11px 11px;font-family:var(--f-comic);font-size:12px;line-height:1.3}
.panel .tx small{display:block;font-size:10px;color:#222;margin-top:3px}
.panel .stamp{display:inline-block;margin-top:6px;font-family:var(--f-mono);font-size:10px;background:#fff;border:1.5px solid var(--k);padding:1px 5px;color:var(--k)}
.panel .stamp.plus{background:#fff}
.panel.fail{background:#fff}
.panel.fail .tx{color:#000}
.panel.fail .why{font-family:var(--f-body);font-size:10px;line-height:1.45;margin-top:6px;color:#222}
.panel.ghost{background:transparent;border:3px dashed #555;box-shadow:none;animation:none;min-height:110px;align-items:center;justify-content:center;color:#555;font-family:var(--f-comic);font-size:12px;text-align:center;padding:14px}
.panel.ghost b{font-family:var(--f-display);font-size:34px;display:block}
.panel.end{background:#fff}
.result{margin-top:18px;background:var(--deck);color:var(--ink);border-radius:14px;padding:18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start;border:1px solid var(--line)}
.result h3{font-size:20px}
.result.ok h3{color:var(--life)} .result.bad h3{color:var(--crit)}
.result .score{font-family:var(--f-display);font-size:38px;font-weight:900;color:var(--signal);text-align:right;line-height:1}
.result .score small{display:block;font-family:var(--f-mono);font-size:11px;color:var(--ink3);font-weight:400;margin-top:4px}
.result ul{margin:8px 0 0;padding-left:18px;font-size:10px;color:var(--ink2)}
.result .fact{margin-top:12px;font-size:10px;color:var(--ink2);border-left:2px solid var(--line2);padding-left:10px}
.result .fact b{color:var(--ink);font-weight:600}
.result .act{grid-column:1/-1;display:flex;gap:10px;flex-wrap:wrap}

/* end */
.endc{border:1px solid var(--line);border-radius:18px;background:var(--deck);padding:26px;display:flex;flex-direction:column;gap:18px}
.endc h1{font-size:clamp(26px,4vw,44px)}
.rank{font-family:var(--f-display);font-weight:900;font-size:clamp(22px,3vw,32px);color:var(--signal)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpi{background:var(--deck2);border-radius:12px;padding:14px}
.kpi b{display:block;font-family:var(--f-display);font-size:26px}
.kpi span{font-size:10px;color:var(--ink2)}
table.lb{width:100%;border-collapse:collapse;font-size:10px}
table.lb th{text-align:left;font-family:var(--f-mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink3);font-weight:400;padding:6px 8px;border-bottom:1px solid var(--line)}
table.lb td{padding:8px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.foot{font-size:10px;color:var(--ink3);border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:6px}
.foot a{color:var(--ink2)}

@media (max-width:900px){
  .hero,.brief,.plan{grid-template-columns:minmax(0,1fr)}
  .locs,.missions{grid-template-columns:minmax(0,1fr)}
  .how,.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}
  .steps{margin-left:0}
  .mis .cols{grid-template-columns:minmax(0,1fr)}
  .result{grid-template-columns:minmax(0,1fr)}
  .result .score{text-align:left}
}
@media (max-width:480px){
  .pr{grid-template-columns:18px 44px minmax(0,1fr);}
  .pr .ctl{grid-column:2/-1}
  .trv{padding-left:72px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* ---- v2: складність, режим, підказки, результати, міні-ігри ---- */
.how{grid-template-columns:repeat(5,minmax(0,1fr))}
.lochead{justify-content:space-between}
.mode{display:flex;flex-direction:column;gap:6px;min-width:0}
.seg{display:flex;border:1px solid var(--line2);border-radius:12px;padding:4px;gap:4px;background:var(--deck);flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:9px;padding:9px 14px;text-align:left;display:flex;flex-direction:column;gap:2px;color:var(--ink2);flex:1 1 180px}
.seg button b{font-size:10px;color:var(--ink)}
.seg button small{font-size:10px}
.seg button.on{background:var(--signal);color:var(--signal-ink)}
.seg button.on b{color:var(--signal-ink)}
.mtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lvl{display:inline-flex;align-items:center;gap:3px;font-family:var(--f-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;padding:3px 9px 3px 7px;border-radius:999px;border:1px solid currentColor}
.lvl i{width:7px;height:7px;border-radius:50%;border:1.5px solid currentColor;display:inline-block}
.lvl i.on{background:currentColor}
.lvl i:last-of-type{margin-right:5px}
.lvl.l1{color:var(--life)} .lvl.l2{color:var(--pen)} .lvl.l3{color:var(--crit)}
.mis .why{font-size:10px;color:var(--ink2);margin-top:-6px}
.pi .du{display:flex;flex-direction:column;align-items:flex-end;gap:2px;white-space:nowrap}
.pi .du em{font-style:normal;font-family:var(--f-body);font-size:10px;color:var(--ink3)}
.pool .pi.in .du::after{content:none}
.pool .pi.in .du em{color:var(--life)}
.hl{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:3px}
.hl li{font-size:10px;line-height:1.35;color:var(--ink2);padding-left:12px;position:relative}
.hl li::before{content:'';position:absolute;left:2px;top:6px;width:5px;height:5px;border-radius:1px;background:var(--extra)}
.shelf{border:1px solid var(--line);border-radius:16px;background:var(--deck);padding:18px;display:flex;flex-direction:column;gap:12px}
.shelfhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.shelfhead h3{font-size:12px}
.shelfhead span{font-size:10px}
.achs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.achs.col{grid-template-columns:minmax(0,1fr)}
.ach{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:12px;background:var(--deck2);border:1px solid transparent;min-width:0}
.ach svg{width:44px;height:44px;flex:none}
.ach span{display:flex;flex-direction:column;min-width:0}
.ach b{font-size:10px}
.ach small{font-size:10px;color:var(--ink3);line-height:1.35}
.ach:not(.on) b{color:var(--ink3)}
.ach.new{border-color:var(--signal);animation:glow 1.6s ease 2}
.inkbtn{color:var(--k)!important;border-color:var(--k)!important}
.result{display:flex;flex-direction:column;align-items:stretch;gap:16px}
.rhead{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.score.bad{color:var(--crit)}
.rgrid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) minmax(0,1.2fr);gap:12px}
.rgrid.two{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
.rbox{background:var(--deck2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;min-width:0}
.rbox h4{margin:0;font-family:var(--f-display);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink2)}
.rbox p{margin:0;font-size:10px;line-height:1.5}
.rbox.fact{border:1px solid var(--line2);background:linear-gradient(160deg,var(--deck3),var(--deck2))}
.rbox.fact h4{color:var(--signal)}
.sc{width:100%;border-collapse:collapse;font-size:10px}
.sc td{padding:4px 0;border-bottom:1px dashed var(--line)}
.sc td:last-child{text-align:right;color:var(--ink)}
.sc td:nth-child(2){padding:4px 8px;font-size:10px}
.carry{font-size:10px!important;color:var(--extra)}
.src{font-family:var(--f-mono);font-size:10px;color:var(--ink3)}
.sh{font-size:12px;margin-bottom:10px}
.facts{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.facts article{background:var(--deck2);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.facts p{margin:0;font-size:10px}
.stamp.mg{background:#fff}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--deck3);color:var(--ink);border:1px solid var(--line2);padding:10px 14px;border-radius:10px;font-size:10px;z-index:40;max-width:90vw}
.modal{position:fixed;inset:0;z-index:30;background:#000;display:flex;align-items:center;justify-content:center;padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:fadeup .2s ease both}
.mgcard{width:100%;max-width:560px;max-height:100%;overflow:auto;background:var(--paper);color:var(--k);border:3px solid var(--k);box-shadow:8px 8px 0 #000;border-radius:6px;display:flex;flex-direction:column}
.mghead{padding:16px 18px 10px;border-bottom:3px solid var(--k);background:#fff}
.mghead .eyebrow{color:#222}
.mghead h3{font-family:var(--f-display);font-size:18px;margin:4px 0 6px}
.mghead p{margin:0;font-family:var(--f-comic);font-size:12px;line-height:1.35}
.mgarea{padding:18px}
.mgfoot{display:flex;align-items:center;gap:10px;padding:12px 18px;border-top:2px dashed #555}
.mgmsg{flex:1;font-family:var(--f-comic);font-size:12px}
.mgfoot .btn.ghost{color:var(--k);border-color:var(--k)}
.mgsub{margin:10px 0 0;font-family:var(--f-mono);font-size:10px;color:#222}
.aim{display:flex;flex-direction:column;gap:16px}
.track{position:relative;height:58px;border:3px solid var(--k);background:repeating-linear-gradient(90deg,#9a9a9a 0 1px,transparent 1px 10%) ,#fff;border-radius:6px;overflow:hidden}
.zone{position:absolute;top:0;bottom:0;background:#9a9a9a;border-left:2px solid var(--k);border-right:2px solid var(--k)}
.mark{position:absolute;top:-3px;bottom:-3px;width:6px;margin-left:-3px;background:var(--k)}
.mark.hit{background:#555;width:10px;margin-left:-5px}
.mark.miss{background:#555}
.aimrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tries{font-family:var(--f-mono);font-size:10px}
.pz{display:grid;grid-template-columns:repeat(3,1fr);gap:3px;background:var(--k);border:3px solid var(--k)}
.tile{padding:0;border:0;background:#000;aspect-ratio:100/60;display:block;position:relative;cursor:pointer}
.tile svg{display:block;width:100%;height:100%}
.tile.sel{outline:4px solid #fff;outline-offset:-4px;z-index:1}
.pz.solved{gap:0}
.mem{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.card{aspect-ratio:1;border:3px solid var(--k);border-radius:6px;background:#000;color:#fff;font-family:var(--f-display);font-size:22px;display:flex;align-items:center;justify-content:center;padding:6px}
.card.open{background:#fff}
.card.done{background:#fff}
.card svg{width:100%;height:100%}
@media (max-width:900px){
 .how{grid-template-columns:repeat(2,minmax(0,1fr))}
 .rgrid,.rgrid.two{grid-template-columns:minmax(0,1fr)}
 .lochead{flex-direction:column;align-items:stretch}
}
@media (max-width:480px){ .mem{grid-template-columns:repeat(3,1fr)} }


/* ================= Піксельний місяць: шкіра ================= */
/* Прямі кути, без тіней і розмиття. Рамки 1 px. */
*,*::before,*::after{border-radius:0!important;box-shadow:none!important;backdrop-filter:none!important;text-shadow:none!important}
body{font-family:var(--f-body);font-size:12px;line-height:1.45;letter-spacing:.01em}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.eyebrow,.mono,.chip,.dpill,.steps span,.tag,.src,.stamp,.seg button,.tab,.pc{font-family:var(--f-mono)}
.eyebrow{font-size:8px;letter-spacing:.16em}
.mono{font-size:10px;letter-spacing:.04em}
.chip{font-size:10px;letter-spacing:.06em;border:1px solid var(--line2);padding:4px 9px}
.chip b{font-weight:400;color:#fff}

/* Кнопки: головна — біле на чорному тексті, другорядна — чорна з білою рамкою. */
.btn{background:#fff;color:#000;border:1px solid #fff;font-family:var(--f-mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:12px 18px;transition:none}
.btn:hover{background:#000;color:#fff;filter:none}
.btn:active{transform:none}
.btn.ghost{background:#000;color:#fff;border:1px solid #fff}
.btn.ghost:hover{background:#fff;color:#000}
.btn.sm{font-size:8px;padding:9px 12px}
button:focus-visible,input:focus-visible,[tabindex]:focus-visible{outline:2px solid #fff;outline-offset:2px}

/* Панелі: чорна заливка, біла рамка 1 px. */
.top,.card,.mis,.panel,.result,.rbox,.shelf,.how>div,.sub,.mgcard,.pr,.hl,.facts article{background:#000;border:1px solid var(--line2)}
.brand i{background:#fff;border-radius:0!important;width:10px;height:10px}

/* Активний стан — інверсія. */
.steps span.on,.seg button.on,.chip.pl,.tab.on{background:#fff!important;color:#000!important;border-color:#fff!important}
.steps span.on b,.seg button.on b,.chip.pl b{color:#000!important}

/* ---- Зміст не кольором, а візерунком (вимога доступності з гайда) ---- */
/* Типи завдань: суцільне / діагональна штриховка / смуги / точки. */
.k{border:1px solid #fff}
.k.main{background:#fff}
.k.extra{background:repeating-linear-gradient(135deg,#fff 0 2px,#000 2px 4px)}
.k.life{background:repeating-linear-gradient(90deg,#fff 0 2px,#000 2px 4px)}
.k.trap,.k.blocked{background:radial-gradient(#fff 1px,#000 1.4px) 0 0/3px 3px;border-color:#9a9a9a}

.bar .seg{border:1px solid #fff}
.bar .seg.main{background:#fff}
.bar .seg.extra{background:repeating-linear-gradient(135deg,#fff 0 2px,#000 2px 4px)}
.bar .seg.life{background:repeating-linear-gradient(90deg,#fff 0 2px,#000 2px 4px)}
.bar .seg.trap,.bar .seg.blocked{background:radial-gradient(#fff 1px,#000 1.4px) 0 0/3px 3px;border-color:#9a9a9a}
.bar .seg.tr{background:repeating-linear-gradient(45deg,#9a9a9a 0 1px,#000 1px 3px);border-color:#555}
/* Немає зв'язку — діагональна штриховка; буря — точки; межа — суцільна лінія. */
.bar .los{background:repeating-linear-gradient(135deg,#9a9a9a 0 1px,#000 1px 4px);border-left:1px dashed #fff;border-right:1px dashed #fff}
.bar .los span{color:#fff;font-family:var(--f-mono);font-size:8px;background:#000;padding:0 2px}
.bar .cut{background:#fff;width:2px}

/* Межі завдань у плані: смужка ліворуч стає візерунком. */
.pr{border-left:3px solid #fff}
.pr.extra{border-left-style:dashed}
.pr.life{border-left-style:double;border-left-width:4px}
.pr.trap,.pr.blocked{border-left-style:dotted;border-left-color:#9a9a9a}

/* Рівень складності — числом, не кольором. */
.lvl{color:#fff!important;font-family:var(--f-mono);font-size:8px}
.lvl.l1::after{content:' ▪'} .lvl.l2::after{content:' ▪▪'} .lvl.l3::after{content:' ▪▪▪'}

/* Точки днів — формою, не кольором. */
.dots i{border:1px solid #fff;background:#000}
.dots i.ok{background:#fff}
.dots i.cur{background:repeating-linear-gradient(135deg,#fff 0 1px,#000 1px 3px)}
.dots i.c{outline:1px solid #fff;outline-offset:2px}

/* Шкали: порожня частина графітова, заповнена біла. */
.pwrbar,.timebar,.gbar,.meter,.sg i{background:var(--empty)}

/* Комікс: чорна сцена, біла рамка. Жодного зсуву-тіні. */
.comicwrap{background:#000;border:1px solid var(--line2);padding:14px}
.panel{background:#000;border:1px solid #fff;color:#fff;animation:none}
.panel .mv{background:#000;border:1px solid #fff;color:#fff;font-family:var(--f-display);font-size:16px}
.result.ok h3,.result.bad h3,.result .score,.rank,.hero h1 span,.how em,.mis .ml,.mis .el,.stat.ok b,.stat.bad b,.trv.wt,.fl.fx,.fl.cm,.fl.out,.fl.cr,.sub.warn b,.launch .note.warn{color:#fff}
.sub.warn{border:1px solid #fff;background:#000}
.sub.prev{border:1px dashed #9a9a9a;color:#9a9a9a}
.pool .pi.in .du::after,.pool .pi.in .du em{color:#fff}
.hl li::before{background:#fff}
.ach.new{border-color:#fff;animation:none}
.screen .badge i{background:#fff;animation:none}
.screen.rec .badge i{background:#9a9a9a}
.dpill.c{border-color:#fff;color:#fff}

/* Прибрати решту анімацій механіки: за гайдом рухається лише фон. */
.panel,.ach,.btn,.seg button,.steps span{animation:none!important;transition:none!important}

/* Текст: Press Start 2P дуже широкий, тож ним лише короткі рядки. */
.pool .pi .n,.pr .n,.panel p,.facts p,.sub,.lead,.story,.mis p,.how span{font-family:var(--f-body);letter-spacing:0}


/* Легенда смужки дня: ті самі візерунки, що й на самій смужці. */
.legend i{width:14px;height:10px;display:inline-block;border:1px solid #fff;vertical-align:-1px}
.legend i.k.main{background:#fff}
.legend i.k.life{background:repeating-linear-gradient(90deg,#fff 0 2px,#000 2px 4px)}
.legend i.k.extra{background:repeating-linear-gradient(135deg,#fff 0 2px,#000 2px 4px)}
.legend i.k.tr{background:repeating-linear-gradient(45deg,#9a9a9a 0 1px,#000 1px 3px);border-color:#555}
.legend i.k.los{background:repeating-linear-gradient(135deg,#9a9a9a 0 1px,#000 1px 4px);border-color:#9a9a9a}


/* Комікс: панель завжди чорна; білим лише те, що має бути інверсією. */
.panel,.panel.fail,.panel.end{background:#000;color:#fff;border:1px solid #fff}
.panel .pic{border-bottom:1px solid #fff;background:#000}
.panel.fail .tx,.panel.end .tx{color:#fff}
.panel .tx small,.panel.fail .why{color:#9a9a9a}
/* Мітка часу й штампи — інверсія: білий фон, чорний текст. */
.panel .t,.panel .stamp,.panel .stamp.plus,.stamp.mg{background:#fff!important;color:#000!important;border:1px solid #fff}
.panel .mv{background:#000;color:#fff;border:1px solid #fff}
.panel.ghost{background:#000;border:1px dashed #555;color:#9a9a9a}
.tm.lt{color:#fff;text-decoration:underline}


/* Вікно міні-гри: чорне, біла рамка 1 px. */
.mgcard{background:#000;color:#fff;border:1px solid #fff}
.mghead{background:#000;border-bottom:1px solid #fff;color:#fff}
.mghead .eyebrow{color:#9a9a9a}
.mghead h3,.mghead p,.mgmsg{color:#fff}
.mgsub{color:#9a9a9a}
.mgfoot{border-top:1px dashed #555}
.mgfoot .btn.ghost{color:#fff;border-color:#fff;background:#000}
.mgfoot .btn.ghost:hover{background:#fff;color:#000}
.mg{background:#000}


/* Наведення на інверсних кнопках: текст мусить перевертатися разом із тлом. */
.inkbtn:hover,.btn.ghost.inkbtn:hover{background:#fff!important;color:#000!important;border-color:#fff!important}



/* ================= Єдиний шар: типографіка та компоненти =================
   Заголовки й великі числа: Handjet 700. Увесь інший текст: Press Start 2P 8/10/12, line-height 1.7. */
:root{--f-display:'Handjet',monospace;--f-body:'Press Start 2P',monospace;--f-mono:'Press Start 2P',monospace;--f-comic:'Press Start 2P',monospace;
 --fs-s:8px;--fs-m:10px;--fs-l:12px;--lh:1.7}
body{font-family:var(--f-body);font-size:var(--fs-m);line-height:var(--lh);letter-spacing:0}
button,input,textarea,select{font:inherit;letter-spacing:inherit}
h1,h2,h3,h4,.title,.score,.kpi b,.rank,.hero h1{font-family:var(--f-display);font-weight:700;line-height:1.1}
.eyebrow,.src,.tag,.stamp,.fl,.dpill,.legend,.tip,small,.mono{font-size:var(--fs-s);line-height:var(--lh)}
.eyebrow,.chip,.btn,.steps span,.rbox h4,table.lb th{text-transform:uppercase;letter-spacing:.08em}
p,li,td,.sub,.nm,.lead,.story,.mis p,.how span,.rbox p,.facts p{font-size:var(--fs-m);line-height:var(--lh);letter-spacing:0}
.pool .pi .n,.pr .n,.panel p,.facts p,.sub,.lead,.story,.mis p,.how span{font-family:var(--f-body)}
/* Жодних градієнтів, фільтрів і плавності */
.screen,.screen.retro svg.face,.rbox.fact{background:#000;filter:none}
.screen.retro svg.face{filter:none}
.brand i{background:#fff}
*,*::before,*::after{transition:none!important}
.sub,.pi,.modal,.speaking .mouth,.ach.new,.panel,.screen .badge i{animation:none!important}
.mgfoot .btn,.mgmsg{font-size:var(--fs-m)}
.toast,.modal .mgcard{font-size:var(--fs-m)}
/* ---- Компоненти ---- */
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid #555;padding-bottom:6px}
.tab{background:#000;color:#fff;border:1px solid #555;padding:8px 12px;font:inherit;font-size:var(--fs-s);text-transform:uppercase;letter-spacing:.08em;cursor:pointer}
.tab:hover{border-color:#fff}
.tab.on,.tab[aria-selected="true"]{background:#fff;color:#000;border-color:#fff}
.tabpane[hidden]{display:none}
.hbtn{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;padding:0;background:#000;color:#fff;border:1px solid #fff;font:inherit;font-size:var(--fs-m);cursor:pointer}
.hbtn[aria-expanded="true"],.hbtn:hover{background:#fff;color:#000}
.helppane{border:1px solid #fff;background:#000;padding:12px;margin-top:8px;color:#fff}
.helppane[hidden]{display:none}
details.more{border:1px solid #555;background:#000}
details.more>summary{cursor:pointer;padding:8px 12px;font-size:var(--fs-s);text-transform:uppercase;letter-spacing:.08em;color:#9a9a9a;list-style:none}
details.more>summary::-webkit-details-marker{display:none}
details.more>summary::before{content:'+ '}
details.more[open]>summary::before{content:'- '}
details.more[open]>summary{background:#fff;color:#000}
details.more>.mbody{padding:12px;background:#000;color:#fff}
.meter{height:12px;border:1px solid #555;background:#222;position:relative;display:block}
.meter>i{display:block;height:100%}
.meter.energy>i{background:repeating-linear-gradient(90deg,#fff 0 6px,transparent 6px 8px)}
.meter.supply>i{background:repeating-linear-gradient(135deg,#fff 0 2px,#000 2px 4px)}
.meter.rad>i{background:radial-gradient(#fff 1.2px,transparent 1.6px) 0 0/4px 4px}
.spr{display:inline-block;image-rendering:pixelated;shape-rendering:crispEdges;vertical-align:middle}
.spr svg{display:block;shape-rendering:crispEdges}
.svgt{font-family:var(--f-body)}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
/* ---- Фон: зорі й планета. Рухається лише він. ---- */
#sky{position:fixed;inset:0;z-index:-1;background:#000;overflow:hidden;pointer-events:none}
#sky .st{position:absolute;inset:0;image-rendering:pixelated;background-size:144px 144px;animation:twk 5s steps(2,end) infinite}
#sky .st.a{background-image:var(--stars-a)}
#sky .st.b{background-image:var(--stars-b);animation-delay:-2.5s;animation-duration:6s}
@keyframes twk{0%{opacity:1}50%{opacity:.25}}
.planet{position:absolute;top:24px;right:24px;width:128px;height:128px;image-rendering:pixelated;background-size:1536px 128px;background-repeat:no-repeat;animation:spin 120s steps(12,end) infinite}
.planet.moon{background-image:var(--sheet-moon)}.planet.earth{background-image:var(--sheet-earth)}.planet.mars{background-image:var(--sheet-mars)}
@keyframes spin{to{background-position:-1536px 0}}
@media (max-width:600px){.planet{width:96px;height:96px;background-size:1152px 96px;top:12px;right:12px}@keyframes spin{to{background-position:-1152px 0}}}
@media (prefers-reduced-motion:reduce){#sky .st,.planet{animation:none!important}}
/* Під текстом чорна підкладка */
.hero h1,.hero p,.lochead h1,.lochead p,.dayhead h2,.eyebrow,.how,.hero small{background:#000}
.hero h1,.lochead h1,.dayhead h2{display:inline-block;max-width:100%}
.hero p,.lochead p{display:inline-block}
/* ---- Текст у UI: підказки, розкривні блоки, значок джерела ---- */
.pool .hl{display:none}
.pool.hl-on .hl{display:flex}
h3 .hbtn,h3 .btn{vertical-align:middle;margin-left:6px}
.nasa{position:fixed;left:8px;bottom:8px;z-index:50;background:#000;color:#fff;border:1px solid #fff;padding:6px 8px;font-size:8px;line-height:1.7;letter-spacing:.08em;text-decoration:none}
.nasa:hover{background:#fff;color:#000}
.shelf,.foot{border:0;padding:0}
.shelf .mbody p{margin:0 0 10px}
body{padding-bottom:56px}
.brand{font-family:var(--f-display);font-size:22px;font-weight:700}
.planner h3,.shelfhead h3,.sh{font-size:20px}
.hbtn,.btn,.tab{font-family:var(--f-body)}
/* ---- Правки після перевірки ---- */
/* Панелі «?» і досягнень: спливають поверх, макет не рухається */
.helppane{position:fixed;left:50%;top:96px;transform:translateX(-50%);width:min(440px,calc(100vw - 32px));max-height:70vh;overflow:auto;z-index:60;margin:0}
.helppane.wide{width:min(760px,calc(100vw - 32px))}
.top .btn{display:inline-flex;gap:6px}
.app>header.top{order:-3}
.app>details.more{order:-2}
/* Заголовки блоками з відступами, чорна підкладка тільки під текстом */
.hero h1,.lochead h1,.dayhead h2,.hero p,.lochead p{display:block;width:fit-content;max-width:100%}
.hero h1{margin:6px 0 10px}
.lochead h1{margin:6px 0 8px}
.lochead .eyebrow,.hero .eyebrow{display:block;width:fit-content}
.hero{grid-template-columns:minmax(0,1fr)}
/* Зорі: мало й повільно; перша шар нерухомий */
#sky .st{background-size:288px 288px}
#sky .st.a{animation:none}
#sky .st.b{animation-duration:6s;animation-delay:0s}
/* Планування: компактний список зліва, більше місця плану */
.plan{grid-template-columns:minmax(0,420px) minmax(0,1fr)}
.pool{padding:10px}
.pool .pgroup{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px}
.pool .pgroup>.eyebrow{grid-column:1/-1;margin-top:4px}
.pool .pi{grid-template-columns:auto minmax(0,1fr);padding:5px 6px;gap:6px;align-items:start}
.pool .pi .nm{font-size:8px;line-height:1.5}
.pool .pi .nm small{font-size:8px;color:#9a9a9a}
.pool .pi .du{grid-column:1/-1;flex-direction:row;justify-content:space-between;font-size:8px}
.pool .pi .du em{display:none}
.pool .pi .hl{grid-column:1/-1}
.pool .pi.in{opacity:.35}
.rgrid.one{grid-template-columns:minmax(0,1fr)}
@media (max-width:900px){.plan{grid-template-columns:minmax(0,1fr)}.pool .pgroup{grid-template-columns:repeat(2,minmax(0,1fr))}}
.pool .pi .nm small{display:none}
.pool.hl-on .pi .nm small{display:block}
.pool .pi{align-items:center}
.pool .pi .du{grid-column:auto;flex-direction:row;white-space:nowrap}
.pool .pi{grid-template-columns:auto minmax(0,1fr) auto}
.steps span,.dots,.dayhead>div{background:#000}
.bar{min-width:480px}.ticks{min-width:480px}
/* ---- Планування: читабельніше й ширше ---- */
.app{max-width:1800px}
.plan{grid-template-columns:minmax(0,560px) minmax(0,1fr)}
.pool .pi .nm{font-size:10px;line-height:1.6}
.pool .pi .nm small,.pool.hl-on .pi .nm small{font-size:8px}
.pool .pi .du{font-size:10px}
.pool .pi{padding:8px;gap:8px}
.pool h3{font-size:24px}
.plan .eyebrow{font-size:10px}
.plan .legend,.plan .stat,.plan .stat b,.plan .launch .note,.plan .rows .empty{font-size:10px}
.plan .pr .nm{font-size:10px}
.plan .pr .nm small,.plan .trv,.plan .ticks{font-size:8px}
.plan .pr .tm{font-size:12px}
.mode{margin:4px 0 8px}
.seg button{flex:0 1 auto}
.dep{display:block;margin-top:4px;padding:2px 4px;border:1px dashed #9a9a9a;color:#fff;font-size:8px;line-height:1.6}
.goalbar{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid #fff;background:#000;padding:8px 12px}
.goalbar .meter{width:160px}
.goalist{list-style:none;margin:0 0 12px;padding:0}
.goalist li{font-size:10px;line-height:1.9}
.goalres a{color:#fff}
.radbox{display:inline-flex;align-items:center;gap:8px;margin-left:auto}
.radbox .meter{width:120px}
.stat.bad{border:1px solid #fff}
/* ---- Планування, варіант A: смужка дня зверху, картки під нею ---- */
.plan{display:flex;flex-direction:column;gap:12px;grid-template-columns:none}
.plan>#board{display:contents}
.plan .bar-wrap{order:1}
.plan .sum{order:2}
.plan .rows{order:3}
.plan .pool{order:4;padding:10px;background:#000;border:1px solid #fff}
.plan .launch{order:5;margin:0}
.plan .legendd{order:6}
.bar{height:40px;min-width:0}
.ticks{min-width:0}
.pool .tabs{align-items:center;margin-bottom:8px}
.pool .tabs .sp{flex:1}
.pool .pgroup{display:none;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.pool[data-tab="main"] .pgroup[data-g="main"],.pool[data-tab="life"] .pgroup[data-g="life"],.pool[data-tab="extra"] .pgroup[data-g="extra"],.pool[data-tab="trap"] .pgroup[data-g="trap"],.pool[data-tab="blocked"] .pgroup[data-g="blocked"]{display:grid}
.pool .pi{display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:8px;border:1px solid #fff;min-height:64px}
.pool .pi .k{display:none}
.pool .pi .du{flex-direction:row;gap:6px;color:#9a9a9a}
.pool .pi.lock{border-style:dashed;border-color:#9a9a9a;color:#9a9a9a}
.pool .pi.in{opacity:.35}
.pool .pi.trap,.pool .pi.blocked{border-style:dotted;border-color:#9a9a9a}
@media (max-width:900px){.pool .pgroup{grid-template-columns:repeat(2,minmax(0,1fr))}}
.plan{align-items:stretch}
.plan .bar-wrap{width:100%}
.bar{border:1px solid #fff}
/* Картки зверху, список плану під ними: нове завдання з'являється внизу й нічого не зсуває */
.plan .pool{order:3}
.plan .rows{order:4;min-height:96px}
.plan .launch{order:5;position:sticky;bottom:0;z-index:5;background:#000;padding:10px 0;border-top:1px solid #fff}
.plan .legendd{order:6}
.nasa{bottom:8px}
.plan .pool{order:2}
.plan .sum{order:3}
.plan .rows{order:4}
/* Більші й чіткіші картинки */
.comic{grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:16px}
.screen{aspect-ratio:16/8.6}
.loc .art{aspect-ratio:300/180}
/* ---- Спрощення верху екрана й брифінгу ---- */
.sub,.sub.prev{border:0;background:transparent;padding:6px 0}
.sub.warn{border:0;border-left:2px solid #fff;padding:6px 0 6px 12px}

.screen .who b{font-family:var(--f-display);font-size:26px;line-height:1.1}

.goalbar{display:flex;flex-direction:column;gap:10px;padding:10px 12px}
.goalbar .resrow,.goalbar .reqrow{display:flex;align-items:center;gap:12px;flex-wrap:wrap;width:100%}

.mode{align-self:flex-start;width:fit-content}
.mode .seg{display:inline-flex;flex-wrap:nowrap;width:fit-content}

.langsw button{background:#000;color:#fff;border:0;padding:8px 12px;font:inherit;font-size:10px;cursor:pointer}
.langsw button.on{background:#fff;color:#000}
/* ---- Мінімум ліній: контур лише у смужки часу й блоків завдань ---- */
.top,.goalbar,.call,.planner,.pool,.plan .pool,.helppane.noframe{border:0}
.top{padding:6px 0;background:transparent}
.goalbar{padding:6px 0}
.goalbar .reqrow{border-top:0;padding-top:0}
.tabs{border-bottom:0}
.rows .empty{border:0}
.launch,.plan .launch{border-top:0}

.pr{border-top:1px solid #fff;border-right:1px solid #fff;border-bottom:1px solid #fff}
/* ---- Міні-ігри в iframe ---- */
.mgmodal .mgcard{max-width:1040px;width:96vw}
.mgframe{width:100%;height:min(80vh,740px);border:0;background:#000;display:block}
.mgintro{display:flex;flex-direction:column;align-items:center;gap:16px;padding:28px 16px;text-align:center}
.mgintro p{font-size:12px;max-width:46ch}
.mgresult{text-align:center;padding:36px 16px}
.mgresult h2{font-size:56px;margin:0 0 10px}
.mgresult p{font-size:12px}
/* ================= UX: головна, вступ, планування перетягуванням ================= */
.hero{display:block;text-align:center;padding:10px 0 0}
.hero h1{margin:0 auto;font-size:clamp(28px,4vw,48px)}
.app>.mode{align-self:center;width:fit-content;margin:6px auto 12px}
.mode .seg{display:inline-flex;flex-wrap:nowrap}
.mode .seg button{flex:0 0 auto;padding:14px 28px}

.loc{display:flex;flex-direction:column;gap:10px;padding:0;border:0;background:transparent}

.loctitle{font-size:48px;text-align:center;margin:0;background:#000}

/* вступ */
.intro2{display:flex;flex-direction:column;align-items:center;gap:14px}
.intro-stage{position:relative;width:min(100%,1100px);aspect-ratio:5/3;border:1px solid #555;background:#000;overflow:hidden}
.intro-stage>svg{position:absolute;inset:0;width:100%;height:100%}
.isp-wrap{position:absolute;left:43%;width:14%}
.isp-wrap svg.isp{display:block;width:100%;height:auto}
.isp-wrap.land{bottom:35%;animation:land 4.4s steps(18,end) forwards}
@keyframes land{from{transform:translateY(-520%)}to{transform:translateY(0)}}
.land .flame{position:absolute;left:30%;top:100%;width:40%;animation:flick .3s steps(2,end) infinite,flameoff 4.4s steps(1,end) forwards}
@keyframes flick{50%{opacity:.3}}
@keyframes flameoff{0%,92%{visibility:visible}100%{visibility:hidden}}
.isp-wrap.drift{top:20%;left:12%;width:24%;animation:drift 5s steps(20,end) forwards}
@keyframes drift{to{transform:translateX(150%)}}
.intro-bar{display:flex;justify-content:space-between;align-items:center;gap:16px;width:min(100%,1100px)}
.intro-bar h2{font-size:64px;margin:0}
@media (prefers-reduced-motion:reduce){.isp-wrap,.land .flame{animation:none!important}.land .flame{visibility:hidden}}

/* планування */
.plan2{display:flex;flex-direction:column;gap:14px}

.tb{position:absolute;top:10px;height:62px;min-width:36px;padding:0;display:flex;align-items:center;justify-content:center;background:#000;color:#fff;border:1px solid #fff;touch-action:none;cursor:grab;z-index:2}

/* ---------- Побудова дня ---------- */
function missionEnv(L, M){
 const zones = {};
 for(const k in L.zones) zones[k] = {...L.zones[k]};
 for(const k in (M.zones||{})) zones[k] = {...(zones[k]||{}), ...M.zones[k]};
 zones.ANY = {n:'на місці', sc:null};
 const ids = Object.keys(zones).filter(k=>k!=='ANY');
 const D = {}; ids.forEach(a=>{D[a]={}; ids.forEach(b=>D[a][b]= a===b?0:Infinity);});
 for(const [a,b,w] of [...L.edges, ...(M.edges||[])]){ if(D[a]&&D[b]){D[a][b]=Math.min(D[a][b],w);D[b][a]=Math.min(D[b][a],w);} }
 for(const k of ids) for(const i of ids) for(const j of ids) if(D[i][k]+D[k][j]<D[i][j]) D[i][j]=D[i][k]+D[k][j];
 return {zones, dist:D, suit:L.suit, home:L.home};
}

/* cspec: null | {kind:'script'} | {kind:'gen', id}; plan: масив cspec на всю місію */
function resolveComp(L, M, di, cspec){
 if(!cspec) return null;
 if(cspec.kind==='script') return M.days[di].comp ? {...M.days[di].comp, kind:'script'} : null;
 const g = (L.gen||{})[cspec.id]; return g ? {...g, kind:'gen', gid:cspec.id} : null;
}
function buildDay(L, M, di, carry, cspec, plan){
 const D = M.days[di], comp = resolveComp(L, M, di, cspec), env = missionEnv(L, M);
 const tasks = [];
 for(const t of L.life){
  const x = {...t, ...(D.mod&&D.mod[t.id]||{})};
  if(t.id==='sport' && D.noSport){ x.k='trap'; x.trapNote='Скасовано ЦУП: вихід і є навантаженням'; }
  tasks.push(x);
 }
 for(const t of D.tasks){
  if(t.ifComp!=null && !(plan && plan[t.ifComp] && plan[t.ifComp].kind==='script')) continue;
  tasks.push({...t});
 }
 if(comp){
  for(const t of comp.add||[]) tasks.push({...t, fromComp:1});
  for(const id in comp.mod||{}){ const x=tasks.find(t=>t.id===id); if(x) Object.assign(x, comp.mod[id]); }
  for(const id in comp.longer||{}){ const x=tasks.find(t=>t.id===id); if(x){ x.d+=comp.longer[id]; x.longer=comp.longer[id]; } }
 }
 for(const c of carry||[]) if(!tasks.some(t=>t.id===c.id)) tasks.push({...c, k:'extra', carried:1});
 const has = new Set(tasks.map(t=>t.id));
 for(const t of tasks){
  if(t.after) t.after = t.after.filter(r=>has.has(r));
  if(t.before) t.before = t.before.filter(r=>has.has(r));
  if(t.softAfter) t.softAfter = t.softAfter.filter(r=>has.has(r));
  if(t.gap && !has.has(t.gap.ref)) delete t.gap;
  if(t.within && !has.has(t.within.ref)) delete t.within;
  const mg = (MG[M.id]||{})[t.id]; if(mg && !t.mg) t.mg = mg;
 }
 const blackout = !!(comp&&comp.blackout);
 if(blackout) for(const t of tasks) if(t.comm){ t.k='blocked'; }
 const by = {}; tasks.forEach(t=>by[t.id]=t);
 const start = toMin(D.start || L.start);
 return {L, M, D, di, comp, env, tasks, by, blackout,
  los:[...(D.los||[]), ...((comp&&comp.los)||[])].sort((a,b)=>toMin(a[0])-toMin(b[0])),
  start, len:(comp&&comp.len)||D.len||L.len, suitMax:(comp&&comp.suitMax)||D.suitMax||L.suitMax||0};
}

/* Випадкові ускладнення: які загальні події можливі в який день (заповнює test.js) */
const GEN_OK = /*GEN_OK*/{"iss-power:0":["tdrs"],"iss-power:1":["tdrs","alarm"],"iss-power:2":["tdrs"],"iss-power:3":["storm","tdrs","alarm"],"iss-power:4":["tdrs"],"iss-routine:0":["tdrs","alarm"],"iss-routine:1":["storm","tdrs","alarm"],"iss-routine:2":["tdrs","alarm"],"iss-routine:3":["tdrs","alarm"],"a11:0":["flare","dust","hga"],"a11:1":["dust","hga"],"a15:0":["hga"],"a15:1":["flare","dust","hga"],"a15:2":["flare","dust","hga"],"a17:0":["flare","dust","hga"],"a17:1":["flare","dust","hga"],"a17:2":["flare","dust","hga"],"chapea:0":["relay","suit"],"chapea:1":["dust","suit"],"chapea:2":["dust","relay","suit"],"chapea:3":["dust","relay","suit"],"jezero:0":["dust","relay"],"jezero:1":["relay"],"jezero:2":["relay","suit"],"jezero:3":["dust","relay","suit"]};

function planComps(L, M, rand){
 rand = rand || Math.random;
 const n = M.days.length, want = M.level===1 ? 1 : 2;
 const cand = [];
 for(let i=0;i<n;i++){
  const opts = [];
  if(M.days[i].comp) opts.push({kind:'script'}, {kind:'script'});
  for(const g of GEN_OK[M.id+':'+i]||[]) opts.push({kind:'gen', id:g});
  if(opts.length) cand.push({i, opts});
 }
 const plan = new Array(n).fill(null);
 for(let k=0;k<want && cand.length;k++){
  const w = cand.map(c=>c.opts.some(o=>o.kind==='script')?2:1);
  let r = rand()*w.reduce((a,b)=>a+b,0), j=0;
  while(r>w[j]){ r-=w[j]; j++; }
  const c = cand.splice(j,1)[0];
  plan[c.i] = c.opts[Math.floor(rand()*c.opts.length)];
 }
 return plan;
}

const nameOf = (day,id) => day.by[id] ? day.by[id].n : id;

/* ---------- Виконання плану ---------- */
function run(day, order, preview){
 const env = day.env; let t = day.start, loc = env.home, suited = false, eg = 0;
 const rows = [], done = new Set(), endOf = {}, inPlan = new Set(order);
 let partial = null;
 let brk = null; const cut = day.start + day.len;
 for(let i=0;i<order.length;i++){
  const b = day.by[order[i]]; if(!b) continue;
  const z = b.z; let travel = 0; const from = loc;
  if(z!=='ANY' && z!==loc){ loc = z; } if(i>0) travel = GAP_MIN;
  t += travel; let wait = 0, f = null;
  const F = (key, v) => { if(!f) f = {key, v:{x:b.n, ...(v||{})}, b}; };
  if(b.k==='blocked') F('blackout');
  if(b.fixed){ const fx = toMin(b.fixed); if(t<fx){ wait = fx-t; t = fx; } else if(t>fx) F('late', {fx:b.fixed, at:fmt(t)}); }
  for(const r of b.after||[]) if(!done.has(r)) F('dep', {y:nameOf(day,r)});
  for(const r of b.before||[]) if(done.has(r)) F('before', {y:nameOf(day,r)});
  if(b.within && done.has(b.within.ref)){ const g = t - endOf[b.within.ref]; if(g > b.within.max) F('within', {g, max:b.within.max}); }
  if(b.gap){ if(!done.has(b.gap.ref)) F('dep', {y:nameOf(day,b.gap.ref)}); else { const g = t - endOf[b.gap.ref]; if(g < b.gap.min) F('gap', {g, min:b.gap.min}); } }
  const zi = env.zones[z] || {};
  if(env.suit){
   if(b.egress){ if(suited) F('egress2'); }
   else if(b.ingress){ if(!suited) F('ingress0'); }
   else if(zi.out && !suited) F('noSuit');
   else if(!zi.out && z!=='ANY' && !zi.lock && suited) F('suitIn', {z:zi.n});
  }
  const start = t, end = t + b.d;
  if(b.comm && b.k!=='blocked'){
   for(const [a,c] of day.los){ const A=toMin(a), C=toMin(c); if(start<C && end>A){ F('los', {w:a+'–'+c}); break; } }
  }
  if(suited && !b.egress){ const m = (b.ingress?start:end) - eg; if(m > day.suitMax) F('o2', {m, max:day.suitMax}); }
  if(end > cut) F('cutoff', {end:fmt(cut)});
  const row = {i, b, travel, from, wait, start, end, loc:z==='ANY'?loc:z, suit:suited||!!b.egress||!!b.suit||!!zi.out, pens:[]};
  if(f){ row.fail = f; if(!preview){ rows.push(row); brk = {...f, i:rows.length-1, at:start}; break; } }
  if(b.win && (start<toMin(b.win[0]) || start>toMin(b.win[1]))) row.pens.push({key:'win', v:{x:b.n, at:fmt(start)}});
  if(b.startBy && start>toMin(b.startBy)) row.pens.push({key:'startBy', v:{x:b.n, at:fmt(start), by:b.startBy}});
  for(const r of b.softAfter||[]) if(inPlan.has(r) && !done.has(r)) row.pens.push({key:'softAfter', v:{x:b.n}});
  if(b.k==='trap') row.pens.push({key:'trap', v:{x:b.n}});
  done.add(b.id); endOf[b.id] = end; t = end;
  if(b.egress){ suited = true; eg = end; }
  if(b.ingress) suited = false;
  rows.push(row);
 }
 if(!brk && !preview){
  if(suited) brk = {key:'stillOut', v:{}, i:rows.length, at:t, end:true};
  else {
   const miss = day.tasks.filter(x=>(x.k==='main'||x.k==='life') && !done.has(x.id));
   /* Завдання з soft:1 — втрачена можливість, не катастрофа: день зараховують частково.
      Усе інше (побут, безпека, головна мета дня) валить день, як і раніше. */
   const hard = miss.filter(x=>!x.soft);
   if(hard.length) brk = {key:'missing', v:{list:hard.map(x=>'«'+x.n+'»').join(', '), n:hard.length}, i:rows.length, at:t, end:true, miss:hard};
   else if(miss.length) partial = miss;
  }
 }
 if(!brk){
  const li = rows.length-1;
  rows.forEach((r,j)=>{ if(r.b.last && j!==li) r.pens.push({key:'last', v:{x:rows[li].b.n}}); });
 }
 const okRows = brk ? rows.slice(0, brk.i) : rows;
 let pts = 0;
 for(const r of okRows){ pts += P[r.b.k]||0; pts += r.pens.length*P.pen; }
 const passed = !brk;
 if(passed) pts += (partial?P.half:P.pass) + (day.comp?P.comp:0);
 return {rows, brk, end:t, passed, pts, done, partial,
  extrasDone: okRows.filter(r=>r.b.k==='extra').map(r=>r.b.id),
  pens: okRows.flatMap(r=>r.pens)};
}

const K='#fff';
function rnd(seed){let s=seed>>>0||7;return ()=>{s=(s*1664525+1013904223)>>>0;return s/4294967296;};}
function hash(str){let h=2166136261;for(const c of str){h^=c.charCodeAt(0);h=Math.imul(h,16777619);}return h>>>0;}
const PXC={'#':'#fff','o':'#9a9a9a','k':'#000','m':'#555'};
/* Рядки сітки → rect-и (злиті за горизонтальними серіями). cell — розмір клітинки у viewBox. */
function gridRects(rows, cell, ox, oy, tint){
 let s='';
 for(let y=0;y<rows.length;y++){
  const row=rows[y]; let x=0;
  while(x<row.length){
   const ch=row[x]; if(ch==='.'||!PXC[ch]||ch==='k'){x++;continue;}
   let e=x; while(e<row.length&&row[e]===ch)e++;
   const col=tint||PXC[ch];
   s+='<rect x="'+(ox+x*cell)+'" y="'+(oy+y*cell)+'" width="'+((e-x)*cell)+'" height="'+cell+'" fill="'+col+'"/>';
   x=e;
  }
 }
 return s;
}

/* Метрики зміни для досягнень. Усе береться з того, що рушій уже порахував:
   rows (переходи, очікування, час, зони), pens, extrasDone, межі дня й скафандра. */
function achMetrics(day, r, L){
 const rows=r.rows, env=day.env, m={};
 m.travel=rows.reduce((a,x)=>a+x.travel,0);
 m.wait=rows.reduce((a,x)=>a+x.wait,0);
 m.dur=r.end-day.start;
 m.spare=day.start+day.len-r.end;
 m.crewUSD=Math.round(m.dur/60*CREW_HOUR_USD);
 m.fixedN=day.tasks.filter(t=>t.fixed).length;
 m.o2used=null; m.o2left=null;
 if(env.suit){
  const eg=rows.find(x=>x.b.egress), ing=rows.find(x=>x.b.ingress);
  if(eg&&ing){ let u=0;
   for(const x of rows){ if(!x.suit||x.b.egress) continue;
    const v=(x.b.ingress?x.start:x.end)-eg.end; if(v>u)u=v; }
   m.o2used=u; m.o2left=day.suitMax-u; }
 }
 m.commSlack=null;
 if(day.los&&day.los.length){ let best=Infinity;
  for(const x of rows){ if(!x.b.comm||x.b.k==='blocked') continue;
   for(const [a,c] of day.los){ const A=toMin(a), C=toMin(c);
    if(x.end<=A) best=Math.min(best,A-x.end); else if(x.start>=C) best=Math.min(best,x.start-C); } }
  if(best!==Infinity) m.commSlack=best; }
 let sb=Infinity;
 for(const x of rows) if(x.b.startBy) sb=Math.min(sb,toMin(x.b.startBy)-x.start);
 m.startBySlack=sb===Infinity?null:sb;
 const d=env.dist[env.home]||{}; let far=null,fd=-1;
 for(const z in d) if(d[z]!==Infinity&&d[z]>fd){fd=d[z];far=z;}
 m.farDone=!!(far&&fd>0&&rows.some(x=>x.loc===far&&!x.fail));
 const oz=new Set();
 for(const x of rows){ const z=env.zones[x.loc]; if(z&&z.out&&!x.fail) oz.add(x.loc); }
 m.outZones=oz.size;
 const seq=rows.map(x=>x.loc).filter((z,i,a)=>i===0||z!==a[i-1]);
 m.noLoop=new Set(seq).size===seq.length;
 const cAll=day.tasks.filter(t=>t.comm&&t.k!=='blocked').length;
 const cOk=rows.filter(x=>x.b.comm&&x.b.k!=='blocked'&&!x.fail).length;
 m.commPerfect=(day.los||[]).length>0&&cAll>0&&cOk===cAll;
 m.cutSuit=!!(day.comp&&day.comp.suitMax);
 m.cutLen=!!(day.comp&&day.comp.len);
 m.addedLos=!!(day.comp&&day.comp.los);
 return m;
}

const VOICE_FILES=['bla1','bla2','bla3','bla4','bla5'];
let voiceEl=null, voiceEnd=0, voiceLast=-1, voiceTimer=null, voiceStop=null;
function talkOn(v){ const s=document.querySelector('.screen'); if(s) s.classList.toggle('talk',!!v); }
function stopBabble(){ talkOn(false); clearTimeout(voiceTimer); voiceTimer=null; voiceEnd=0; if(voiceEl){ try{ voiceEl.pause(); }catch(e){} voiceEl=null; } }
const voiceBusy=()=>!!(voiceEl&&!voiceEl.ended&&!voiceEl.paused);
function babble(ms){
 stopBabble(); talkOn(true); voiceEnd=Date.now()+Math.max(600,Math.min(ms,4200));
 const next=()=>{
  if(Date.now()>=voiceEnd){ talkOn(false); return; }
  let i; do{ i=(Math.random()*VOICE_FILES.length)|0; }while(i===voiceLast&&VOICE_FILES.length>1); voiceLast=i;
  const a=new Audio('sound/'+VOICE_FILES[i]+'.wav'); a.volume=.8; voiceEl=a; a.onended=()=>{ voiceTimer=setTimeout(next,60); };
  const p=a.play(); if(p&&p.catch) p.catch(()=>{});
 };
 next();
}

 if(t.within) h.push('Не пізніше ніж через '+t.within.max+' хв після «'+nameOf(day,t.within.ref)+'»');
 if(t.gap) h.push('Відповідь прийде не раніше ніж через '+t.gap.min+' хв після «'+nameOf(day,t.gap.ref)+'»');
 if(t.comm&&t.k!=='blocked') h.push('Потрібен зв’язок: не став у вікно без зв’язку');
 if(t.startBy) h.push('Почати до '+t.startBy);
 if(t.win) h.push('Найкраще між '+t.win[0]+' і '+t.win[1]);
 if(t.softAfter&&t.softAfter.length) h.push('Краще після «'+nameOf(day,t.softAfter[0])+'»');
 if(t.last) h.push('Останнім за день');
 if(t.egress) h.push('Відкриває вихід назовні: далі цокає ресурс скафандра ('+day.suitMax+' хв)');
 if(t.ingress) h.push('Закриває вихід: після нього можна їсти й працювати всередині');
 const zi=day.env.zones[t.z]; if(day.env.suit&&zi&&zi.out&&!t.egress) h.push('Назовні: лише між виходом і поверненням');

 if(t.info) h.push(t.info);
 return h;

 return idx;
}

function failText(brk){
 const [h,why0]=MSG[brk.key](brk.v); const b=brk.b; let why=why0;
 if(b){ if(brk.key==='dep'&&b.depWhy) why=b.depWhy; if(brk.key==='late'&&b.lateWhy) why=b.lateWhy; if(brk.key==='before'&&b.beforeWhy) why=b.beforeWhy; }

function launch(){
 const res=run(S.day,S.plan,false);
 const limit = res.brk ? res.brk.i : res.rows.length;
 const picks=[];
 const cands=res.rows.slice(0,limit).map((r,i)=>({r,i})).filter(x=>x.r.b.mg);
 cands.sort((a,b)=>(a.r.b.k==='main'?0:1)-(b.r.b.k==='main'?0:1));
 for(const c of cands) picks.push(c.i);
 Object.assign(S,{fast:false, result:res, phase:'comic', comicShown:0, comicDone:false, mgQueue:picks.sort((a,b)=>a-b), mgRes:{}});
 render(); playComic();
}
let comicTimer=null;
const comicTotal = () => S.result.rows.length + (S.result.brk ? (S.result.brk.end?1:0) : 1);
function playComic(){
 clearTimeout(comicTimer);
 const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
 const step=()=>{
  if(S.phase!=='comic') return;
  const idx=S.comicShown;
  if(S.mgQueue.includes(idx) && !S.mgRes[idx]){ S.comicShown++; renderComic(); comicTimer=setTimeout(()=>{ if(S.phase!=='comic') return; openMG(idx, ()=>{ renderComic(); next(); }); }, S.fast?500:1300); return; }
  S.comicShown++; renderComic(); next();
 };
 const next=()=>{ if(S.comicShown<comicTotal()) comicTimer=setTimeout(step, (reduce||S.fast)?60:700); else finishComic(); };
 step();
}
function skipComic(){
 clearTimeout(comicTimer); S.fast=true;
 const pend=S.mgQueue.find(i=>!S.mgRes[i]&&i>=S.comicShown);
 if(pend!=null){ S.comicShown=pend; renderComic(); playComic(); return; }
 S.comicShown=comicTotal(); renderComic(); finishComic();
}
function comicView(){
 return '<section class="comicwrap"><div class="comichead"><h2>'+esc(S.day.D.t)+'</h2><span>'+esc(player())+' · '+esc(S.L.n)+'</span><span class="sp"></span><button class="btn ghost sm inkbtn" data-a="skipc">Швидше</button></div><div class="comic" id="comic"></div><div id="res"></div></section>';
}

 let mv=''; if(r.travel) mv='пауза '+r.travel+' хв'; else if(r.wait) mv='чекає '+r.wait+' хв';

function renderComic(){
 const el=document.getElementById('comic'); if(!el) return;
 const r=S.result; let h='';
 const n=Math.min(S.comicShown, r.rows.length);
 for(let i=0;i<n;i++) h+=panelHTML(r.rows[i],i);
 if(S.comicShown>r.rows.length){
  if(r.brk&&r.brk.end){
   const [hh,why]=failText(r.brk);
   h+='<div class="panel fail"><div class="pic">'+scene(null,null,{simple:true,seed:9,fail:true,astro:false})+'</div><span class="t">'+fmt(r.end)+'</span><div class="tx">Кінець дня<small>причина нижче</small></div></div>';
  } else if(!r.brk){
   const zi=S.day.env.zones[S.day.env.home]||{};
   h+='<div class="panel end"><div class="pic">'+scene(zi.sc,'shield',{simple:true,seed:5,sfx:'ЗАРАХОВАНО!'})+'</div><span class="t">'+fmt(r.end)+'</span><div class="tx">Зміну закрито. ЦУП задоволений.<small>Сон, а завтра — новий план.</small></div></div>';

 el.innerHTML=h;
 const last=el.lastElementChild; if(last&&S.comicShown>2&&!matchMedia('(prefers-reduced-motion: reduce)').matches) last.scrollIntoView({block:'nearest',behavior:'smooth'});
}


/* ===== Фон: мерехтливі зірки й піксельна планета. Єдина анімація (гайд, 2.4). ===== */
(function(){
 /* Фон: зорі (CSS, steps(2)) і планета-спрайтлист із 12 кадрів обертання. Дизер: матриця Баєра 8x8. */
 const B8=(()=>{const m=[[0,2],[3,1]];let b=m;for(let n=2;n<8;n*=2){const nb=[];for(let y=0;y<n*2;y++){nb.push([]);for(let x=0;x<n*2;x++){nb[y].push(4*b[y%n][x%n]+m[(y/n)|0][(x/n)|0]);}}b=nb;}return b;})();
 function h3(x,y,z){let h=(x*374761393+y*668265263+z*2147483647)|0;h=(h^(h>>>13))*1274126177|0;return ((h^(h>>>16))>>>0)/4294967296;}
 function n3(x,y,z){const xi=Math.floor(x),yi=Math.floor(y),zi=Math.floor(z),xf=x-xi,yf=y-yi,zf=z-zi;
  const s=t=>t*t*(3-2*t);const u=s(xf),v=s(yf),w=s(zf);let r=0;
  for(let i=0;i<2;i++)for(let j=0;j<2;j++)for(let k=0;k<2;k++)r+=h3(xi+i,yi+j,zi+k)*(i?u:1-u)*(j?v:1-v)*(k?w:1-w);return r;}
 const N=(x,y,z)=>n3(x,y,z)*.6+n3(x*2.1,y*2.1,z*2.1)*.3+n3(x*4.3,y*4.3,z*4.3)*.1;
 /* Тон кулі в точці (x,y,z) на одиничній сфері */
 const TEX={
  moon:(x,y,z)=>{const t=N(x*1.6,y*1.6,z*1.6);return t<.42?.28:(.7+.3*N(x*5,y*5,z*5));},
  earth:(x,y,z)=>{const t=N(x*1.5+3,y*1.5,z*1.5);return Math.abs(y)>.88?1:(t>.52?.78:.3);},
  mars:(x,y,z)=>{const t=N(x*2,y*2,z*2);return Math.abs(y)>.9?1:(.45+.5*t+.1*Math.sin(y*14));}
 };
 /* Лист: 12 кадрів по 64 px у ряд. Повертає dataURL PNG. */
 function sheet(kind){
  const R=30,S=64,F=12,cv=document.createElement('canvas');cv.width=S*F;cv.height=S;const c=cv.getContext('2d');
  c.fillStyle='#000';c.fillRect(0,0,cv.width,cv.height);
  for(let f=0;f<F;f++){
   const rot=f/F*Math.PI*2,cr=Math.cos(rot),sr=Math.sin(rot),ox=f*S+S/2,oy=S/2;
   for(let y=-R;y<=R;y++)for(let x=-R;x<=R;x++){
    const d=Math.hypot(x+.5,y+.5);if(d>R)continue;
    const X=(x+.5)/R,Y=(y+.5)/R,Z=Math.sqrt(Math.max(0,1-X*X-Y*Y));
    if(d>R-1){c.fillStyle='#555';c.fillRect(ox+x,oy+y,1,1);continue;}
    const px=X*cr+Z*sr,pz=-X*sr+Z*cr;
    const light=Math.max(0,Math.min(1,.25+.55*Z-.25*X));
    const lv=light*TEX[kind](px,Y,pz);
    if(lv>(B8[(y+S)&7][(x+f*S+S)&7]+.5)/64){c.fillStyle='#fff';c.fillRect(ox+x,oy+y,1,1);}
   }
  }
  return cv.toDataURL('image/png');
 }
 /* Зорі: плитка 144x144, дві шари блимають по черзі (steps(2)). */
 function starTile(seed,n){
  const r=rnd(seed),cv=document.createElement('canvas');cv.width=cv.height=288;const c=cv.getContext('2d');
  for(let i=0;i<n;i++){c.fillStyle=r()<.5?'#555':'#fff';c.fillRect((r()*96|0)*3,(r()*96|0)*3,3,3);}
  return cv.toDataURL('image/png');
 }
 const root=document.documentElement;
 try{
  ['moon','earth','mars'].forEach(k=>root.style.setProperty('--sheet-'+k,'url('+sheet(k)+')'));
  root.style.setProperty('--stars-a','url('+starTile(11,5)+')');
  root.style.setProperty('--stars-b','url('+starTile(29,3)+')');
 }catch(e){}
 const sky=document.createElement('div');sky.id='sky';sky.setAttribute('aria-hidden','true');
 sky.innerHTML='<i class="st a"></i><i class="st b"></i><i class="planet moon" id="planet"></i>';
 document.body.insertBefore(sky,document.body.firstChild);
 window.setPlanet=function(k){const p=document.getElementById('planet'); if(!p) return;
  if(k==='iss'){ p.className='planet iss'; p.innerHTML='<svg viewBox="0 0 128 128" width="128" height="128" shape-rendering="crispEdges" aria-hidden="true">'+gridRects(SP_STATION,4,8,22)+'<path d="M92 70L104 86" stroke="#9a9a9a" stroke-width="2" stroke-dasharray="4 3" fill="none"/>'+gridRects(AST_S2,2,90,84)+'</svg>'; }
  else { p.className='planet '+(k==='mars'?'mars':'moon'); p.innerHTML=''; } };
})();

function unlock(id){ if(ACH.has(id)) return false; ACH.add(id); S.newAch.push(id); S.missionAch.add(id); saveMeta(); return true; }

/* ---------- Вікно результатів ---------- */
function finishComic(){
 const r=S.result, day=S.day, el=document.getElementById('res'); if(!el||el.dataset.done) return;
 el.dataset.done=1; S.comicDone=true;
 const p=player(); S.newAch=[];
 const okRows=r.brk?r.rows.slice(0,r.brk.i):r.rows;
 const mainOk=okRows.filter(x=>x.b.k==='main').length, mainAll=day.tasks.filter(t=>t.k==='main').length;
 const exAll=day.tasks.filter(t=>t.k==='extra'), exOk=r.extrasDone;
 const mgWon=Object.values(S.mgRes).filter(m=>m.win).length;
 if(!r.brk){
  const mgSum=Object.values(S.mgRes).reduce((a,m)=>a+mgPoints(m),0), base=r.pts+mgSum, mult=S.hints?1:NOHINT_MULT, final=Math.round(base*mult);
  S.total+=final; S.stats[p].pts+=final; S.stats[p].days++;
  const ptsEl=document.getElementById('pts'); if(ptsEl) ptsEl.textContent=S.total;
  S.mgWins+=mgWon;
  exOk.forEach(id=>S.extrasDone.add(id)); okRows.forEach(x=>S.goalDone.add(x.b.id)); S.rad+=radDay(day,okRows); { const gb=document.querySelector('.goalbar'); if(gb) gb.outerHTML=goalBar(); }
  const notDone=exAll.filter(t=>t.carry&&!exOk.includes(t.id));
  S.carry=notDone.map(t=>({...t,carried:0}));
  const factKey=S.M.id+':'+S.di, newFact=!FACTS.has(factKey); FACTS.add(factKey);
  S.dayFacts.push({di:S.di, t:day.D.t, story:day.D.story, comp:day.comp?day.comp:null, src:day.D.src});
  WORLDS.add(S.locId); saveMeta();
  // досягнення
  unlock('first');
  if(!r.pens.length && !r.partial) unlock('clean');
  if(exAll.length && exOk.length===exAll.length) unlock('science');
  if(day.comp) unlock('storm');
  if(!S.hints) unlock('nohint');
  if(day.start+day.len-r.end>=120) unlock('spare');
  if(S.rad<=radLimit()) unlock('radsafe');
  if(Object.values(S.mgRes).some(m=>m.win&&m.perfect)) unlock('aim');
  if(S.mgWins>=5) unlock('hands');
  if(WORLDS.size>=3) unlock('worlds');
  if(S.attempts>0 && S.prevFail && S.prevFail.player===p) unlock('retry');
  /* --- нові досягнення: усе з achMetrics --- */
  const AM=achMetrics(day, r, S.L);
  if(AM.o2left!==null){
   if(AM.o2left>=45) unlock('o2spare');
   if(day.suitMax && AM.o2used<=day.suitMax/2) unlock('o2half');
  }
  if(AM.noLoop) unlock('noloop');
  if(AM.farDone) unlock('farzone');
  if(AM.commSlack!==null && AM.commSlack<=10) unlock('window');
  if(AM.commPerfect) unlock('commall');
  if(AM.fixedN>=1 && AM.wait===0) unlock('nowait');
  if(AM.fixedN>=1 && !r.pens.length) unlock('ontime');
  if(AM.dur<=360) unlock('cheap');
  if(AM.crewUSD<700000) unlock('crew');
  if(AM.cutSuit) unlock('dustday');
  if(AM.cutLen) unlock('shortday');
  if(AM.addedLos) unlock('norelay');
  if(exAll.length && exOk.length===exAll.length && !r.pens.length && !r.partial) unlock('full');
  if(r.partial) unlock('priority');
  if(day.comp){ SEEN.add(S.locId+':'+day.comp.t); if(SEEN.size>=7) unlock('chronicler'); }
  if(FACTS.size>=6) unlock('archivist');
  const last=S.di===S.M.days.length-1;
  if(last){
   unlock('mission'); if(S.fails===0) unlock('flawless');
   if(!S.hints) unlock('hardcore');
   MISS.add(S.M.id);
   const got=id=>MISS.has(id);
  }
  saveMeta();
  S.prevFail=null; S.attempts=0;
  const lines=[
   ['Обов’язкові завдання', mainOk+' з '+mainAll, mainOk*P.main],
   ['Побут', okRows.filter(x=>x.b.k==='life').length+' з '+day.tasks.filter(t=>t.k==='life').length, okRows.filter(x=>x.b.k==='life').length*P.life],

   r.partial ? ['День зараховано частково', 'не встиг: '+r.partial.map(x=>'«'+x.n+'»').join(', '), P.half]
             : ['День зараховано', '', P.pass],
  ];
  if(day.comp) lines.push(['Ускладнення «'+day.comp.t+'»','подолано',P.comp]);
  if(S.mgQueue.length) lines.push(['Міні-ігри', mgWon+' з '+S.mgQueue.length, Object.values(S.mgRes).reduce((a,m)=>a+mgPoints(m),0)]);
  if(r.pens.length) lines.push(['Штрафи', r.pens.length+' × '+P.pen, r.pens.length*P.pen]);

   '<div class="rgrid"><div class="rbox"><h4>Підсумок дня</h4><table class="sc">'+lines.map(l=>'<tr><td>'+esc(l[0])+'</td><td class="muted">'+esc(l[1])+'</td><td class="mono">'+(l[2]>=0?'+':'')+l[2]+'</td></tr>').join('')+'</table>'+(notDone.length?'<p class="carry">Переходить на завтра: '+notDone.map(t=>'«'+esc(t.n)+'»').join(', ')+'</p>':'')+'</div>'+

   '</div>'+

  showAAR();
 } else {

  '<div class="rgrid one"><div class="rbox"><h4>Що сталося</h4><p><b>'+esc(h)+'</b></p>'+(why?'<p class="muted">'+esc(why)+'</p>':'')+'<p class="muted">До провалу: '+(r.brk.end?r.rows.length:r.brk.i)+' '+plural(r.brk.end?r.rows.length:r.brk.i,'кадр','кадри','кадрів')+', обов’язкових — '+mainOk+' з '+mainAll+'. Бали за день не зараховуються.</p></div>'+
  '<div class="rbox"><p class="muted">'+tip+'</p></div></div>'+
  '<div class="act"><button class="btn" data-a="sameplayer">Спробувати ще раз</button></div></div>';

function openMG(idx, done){
 const row=S.result.rows[idx], b=row.b, file=b.mg;
 const wrap=document.createElement('div'); wrap.className='modal mgmodal'; wrap.setAttribute('role','dialog'); wrap.setAttribute('aria-modal','true');
 wrap.innerHTML='<div class="mgcard"><div class="mghead"><span class="eyebrow">Міні-гра · +'+MG_BONUS+' балів</span><h3>«'+esc(b.n)+'»</h3></div>'+

 document.body.appendChild(wrap);
 const area=wrap.querySelector('#mgarea'), skip=wrap.querySelector('#mgskip'), start=wrap.querySelector('#mgstart');
 let finished=false, frame=null;
 const onMsg=e=>{ if(!frame||e.source!==frame.contentWindow) return; const d=e.data; if(d&&d.type==='forpost:minigame-complete'){ const x=d.detail||{}; end(!!x.win,!!x.perfect,false,typeof x.seconds==='number'?x.seconds:null); } };
 const end=(win,perfect,skipped,seconds)=>{
  if(finished) return; finished=true;
  window.removeEventListener('message',onMsg); mgCleanup=null;
  S.mgRes[idx]={win, perfect:!!perfect, type:file, skipped:!!skipped, pts:(win&&seconds!=null)?speedPts(seconds):MG_BONUS, sec:seconds};
  area.innerHTML='<div class="mgresult"><h2>'+(win?(perfect?'Ідеально!':'Готово!'):(skipped?'Пропущено':'Не вийшло'))+'</h2><p>'+(win?'+'+mgPoints(S.mgRes[idx])+' балів'+(seconds!=null?' · '+Math.round(seconds)+' с':'')+'.':'Без бонусу. День триває.')+'</p></div>';
  start.remove(); skip.textContent='Далі →'; skip.classList.remove('ghost'); skip.onclick=()=>{ wrap.remove(); done(); }; skip.focus();
 };
 window.addEventListener('message',onMsg);
 mgCleanup=()=>{ window.removeEventListener('message',onMsg); };
 skip.onclick=()=>end(false,false,true);
 start.onclick=()=>{ area.innerHTML=''; frame=document.createElement('iframe'); frame.className='mgframe'; frame.title=b.n; frame.src='minigames/'+file+'.html?lang='+LANG+'&v=2'; frame.onload=()=>{ try{ const fd=frame.contentDocument, st=fd.createElement('style'); st.textContent=MG_COMPACT; fd.head.appendChild(st); }catch(e){} try{ frame.contentDocument.querySelectorAll('a[href]').forEach(a=>{ if(/index.html$/.test(a.getAttribute('href'))) a.style.display='none'; }); }catch(e){} }; area.appendChild(frame); start.remove(); };
 setTimeout(()=>start.focus(),50);
}

function act(a,v){
 switch(a){
  case 'lang': { LANG=v; store.set('kz-lang',v); EN_CACHE.clear(); if(v==='uk'){ location.reload(); break; } applyLang(); render(); break; }
  case 'help': { const p=document.getElementById(v); if(p){ p.hidden=!p.hidden; const b=document.querySelector('[data-a="help"][data-v="'+v+'"]'); if(b) b.setAttribute('aria-expanded',String(!p.hidden)); } break; }
  case 'hl': { const el=document.querySelector('.pool'); if(el){ el.classList.toggle('hl-on'); const b=document.querySelector('[data-a="hl"]'); if(b) b.setAttribute('aria-expanded',String(el.classList.contains('hl-on'))); } break; }
  case 'ptab': { S.ptab=v; const p=document.querySelector('.pool2'); if(p) p.dataset.tab=v; document.querySelectorAll('.tabs .tab').forEach(b=>{ const on=b.dataset.v===v; b.classList.toggle('on',on); b.setAttribute('aria-selected',String(on)); }); break; }
  case 'home': clearTimeout(briefTimer); clearTimeout(comicTimer); S.view='home'; render(); break;
  case 'loc': readPlayers(); S.locId=v; startMission(v, UI_MISSION[v]); break;
  case 'mode': S.hints = v==='1'; render(); break;
  case 'start': startMission(S.locId,v); break;
  case 'voice': speakAll(); break;
  case 'skip': skipBrief(); break;
  case 'toplan': clearTimeout(briefTimer); stopVoice(); S.phase='plan'; render(); break;
  case 'showfact': { const D=S.day.D, w=document.createElement('div'); w.className='modal'; w.setAttribute('role','dialog'); w.setAttribute('aria-modal','true');
   w.innerHTML='<div class="mgcard"><div class="mghead"><span class="eyebrow">Цікавий факт</span><h3>'+esc(D.t)+'</h3></div><div class="mgarea briefarea"><p>'+esc(D.story)+'</p>'+(S.day.comp&&S.day.comp.real?'<p><b>Про ускладнення.</b> '+esc(S.day.comp.real)+'</p>':'')+'<span class="src">Джерело: '+esc(D.src)+'</span></div><div class="mgfoot"><span class="mgmsg"></span><button class="btn" id="fclose">Закрити</button></div></div>';
   document.body.appendChild(w); w.querySelector('#fclose').onclick=()=>w.remove(); w.addEventListener('click',e=>{ if(e.target===w) w.remove(); }); FACTS.add(S.M.id+':'+S.di); saveMeta(); break; }
  case 'showbrief': { const w=document.createElement('div'); w.className='modal'; w.setAttribute('role','dialog'); w.setAttribute('aria-modal','true');
   const T=k=>ordered(S.day.tasks.filter(t=>t.k===k)).map(t=>'<li>'+ticon(t,28)+' '+esc(t.n)+' <span class="dim">'+t.d+' хв</span></li>').join('');
   const sec=(lab,k)=>S.day.tasks.some(t=>t.k===k)?'<h4>'+lab+'</h4><ul class="brieflist">'+T(k)+'</ul>':'';
   w.innerHTML='<div class="mgcard"><div class="mghead"><span class="eyebrow">Брифінг</span><h3>'+esc(S.day.D.t)+'</h3></div><div class="mgarea briefarea">'+S.brief.map(l=>'<div class="sub '+(l.cls||'')+'">'+(l.head?'<b>'+esc(l.head.toUpperCase())+'</b> ':'')+esc(l.say)+'</div>').join('')+'</div><div class="mgfoot"><span class="mgmsg"></span><button class="btn" id="bclose">Закрити</button></div></div>';
   document.body.appendChild(w); w.querySelector('#bclose').onclick=()=>w.remove(); w.addEventListener('click',e=>{ if(e.target===w) w.remove(); }); break; }
  case 'introdone': clearTimeout(introTimer); if(S.view==='day'&&S.phase==='intro'){ S.phase='brief'; render(); playBrief(); } break;
  case 'rebrief': S.phase='brief'; S.briefShown=0; render(); playBrief(); break;
  case 'toggle': { const i=S.plan.indexOf(v); if(i>=0) S.plan.splice(i,1); else S.plan.push(v); refreshBoard(); break; }
  case 'up': { const j=+v; if(j>0){[S.plan[j-1],S.plan[j]]=[S.plan[j],S.plan[j-1]];} refreshBoard(); break; }
  case 'down': { const j=+v; if(j<S.plan.length-1){[S.plan[j+1],S.plan[j]]=[S.plan[j],S.plan[j+1]];} refreshBoard(); break; }
  case 'clear': S.plan=[]; refreshBoard(); break;
  case 'launch': if(S.plan.length) launch(); break;
  case 'skipc': skipComic(); break;
  case 'next': S.di++; enterDay(); break;
  case 'finish': S.view='end'; render(); break;
  case 'nextplayer': S.pi=(S.pi+1)%S.players.length; enterDay(); break;
  case 'sameplayer': { const keep=S.plan.slice(); enterDay(); S.plan=keep; break; }
  case 'restart': startMission(S.locId,S.M.id); break;
 }
}

const CYR_RX=/[А-Яа-яІіЇїЄєҐґ]/;
let EN_RX=null; const EN_CACHE=new Map();
function enRx(){
 if(!EN_RX){
  /* варіанти з маленької літери: «Легка» → «легка» */
  for(const k of Object.keys(EN_DICT)){ const lk=k.charAt(0).toLowerCase()+k.slice(1); if(lk!==k && !(lk in EN_DICT)){ const v=EN_DICT[k]; EN_DICT[lk]=(/^[A-Z][a-z]/.test(v)?v.charAt(0).toLowerCase()+v.slice(1):v); } }
  const isL=ch=>/[А-Яа-яІіЇїЄєҐґA-Za-z0-9]/.test(ch);
  const keys=Object.keys(EN_DICT).sort((a,b)=>b.length-a.length).map(k=>{
   const e=k.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&');
   return (isL(k.charAt(0))?'(?<![А-Яа-яІіЇїЄєҐґ’])':'')+e+(isL(k.charAt(k.length-1))?'(?![А-Яа-яІіЇїЄєҐґ’])':'');
  });
  EN_RX=new RegExp(keys.join('|'),'g');
 }
 return EN_RX;
}
function trStr(s){
 if(LANG!=='en'||!s||!CYR_RX.test(s)) return s;
 let c=EN_CACHE.get(s); if(c!==undefined) return c;
 let out=s.replace(enRx(),m=>EN_DICT[m]).replace(/«/g,'“').replace(/»/g,'”').replace(/(\d),(\d)/g,'$1.$2');
 EN_CACHE.set(s,out); return out;
}
function trNode(n){
 if(n.nodeType===3){ const t=n.nodeValue; if(CYR_RX.test(t)){ const o=trStr(t); if(o!==t) n.nodeValue=o; } }
 else if(n.nodeType===1){
  if(n.tagName==='SCRIPT'||n.tagName==='STYLE') return;
  trAttrs(n); n.childNodes.forEach(trNode);
 }
}
function trAttrs(n){ for(const a of ['title','aria-label','placeholder','alt']){ const v=n.getAttribute(a); if(v&&CYR_RX.test(v)){ const o=trStr(v); if(o!==v) n.setAttribute(a,o); } } }
let EN_OBS=null;
function applyLang(){
 if(EN_OBS){ EN_OBS.disconnect(); EN_OBS=null; }
 document.documentElement.lang=LANG==='en'?'en':'uk';
 document.title=LANG==='en'?'Space Shift':'Космічна зміна';
 if(LANG==='en'){
  trNode(document.body);
  EN_OBS=new MutationObserver(ms=>{ for(const m of ms){ if(m.type==='characterData') trNode(m.target); else if(m.type==='attributes') trAttrs(m.target); else m.addedNodes.forEach(trNode); } });
  EN_OBS.observe(document.body,{childList:true,subtree:true,characterData:true,attributes:true,attributeFilter:['title','aria-label']});
 }
}

applyLang();
